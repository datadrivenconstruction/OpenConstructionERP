# AHSP koefisien — MEP (perpipaan air + instalasi listrik)
# Source: AHSP Bidang Cipta Karya (Lampiran IV), Permen PUPR No. 1/2022.
# Verified 2026-07-09 line-by-line vs the official PDF (pypdf) — all coefficients
# matched the source table EXACTLY:
#   §6.4.1.1 hal.587 (pipa PVC AW 1/2" air bersih), §6.4.1.19 hal.593 (pipa PVC D 2"
#                     air kotor), §5.3.1.1 hal.466 (1 titik instalasi lampu/stop kontak)
# Pipe material coef 1.450/m' already includes fitting & aksesoris (per source note).
kategori: mep
referensi: "AHSP Bidang Cipta Karya, Permen PUPR No. 1/2022 §6.4.1, §5.3.1"
sumber: "AHSP Bidang Cipta Karya Lampiran IV (hal. 466, 587, 593) — Permen PUPR 1/2022"
items:
