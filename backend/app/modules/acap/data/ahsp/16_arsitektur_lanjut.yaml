# AHSP koefisien — Arsitektur lanjut (kusen kayu, hardware pintu, aksesoris atap,
# roster, cat plafon)
# Source: AHSP Bidang Cipta Karya (Lampiran IV), Permen PUPR No. 1/2022.
# Verified 2026-07-09 line-by-line vs the official PDF (pypdf) — matched EXACTLY:
#   §3.11.3.2 hal.299 (kusen kayu 6x12), §3.11.4.2 hal.302 (kunci tanam),
#   §3.11.4.5 hal.303 (engsel), §3.11.4.18 hal.310 (kait angin),
#   §3.3.1 hal.200 (talang datar seng), §3.3.3 hal.201 (listplank 3x20),
#   §3.6.3.1 hal.221 (roster/kerawang), §3.8.20 hal.242 (cat plafon)
# Cat plafon differs from cat tembok (§3.8.10): 1 dasar + 2 penutup, no plamur.
kategori: arsitektur
referensi: "AHSP Bidang Cipta Karya, Permen PUPR No. 1/2022 §3.11, §3.3, §3.6.3, §3.8.20"
sumber: "AHSP Bidang Cipta Karya Lampiran IV (hal. 200-310) — Permen PUPR 1/2022"
