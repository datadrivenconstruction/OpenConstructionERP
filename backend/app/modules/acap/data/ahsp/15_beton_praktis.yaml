    uraian: "Pembuatan 1 m' kolom praktis beton bertulang 11x11 (beton+besi+bekisting)"
    satuan: m1
    bahan:
      - {nama: "Kayu kelas III", satuan: m3, koef: 0.002}
      - {nama: "Paku 5-12 cm", satuan: kg, koef: 0.010}
