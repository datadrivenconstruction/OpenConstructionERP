# AHSP koefisien — Beton praktis (kolom & ring balok praktis)
# Source: AHSP Bidang Cipta Karya (Lampiran IV), Permen PUPR No. 1/2022 §2.2.1.10.
# Verified 2026-07-09 line-by-line vs the official PDF (pypdf) — matched EXACTLY:
#   §2.2.1.10.1 hal.124 (kolom praktis 11x11), §2.2.1.10.2 hal.125 (ring balok praktis 10x15)
# These are COMPOSITE analyses: one per-m' rate already bundles beton + pembesian +
# bekisting (unlike the divisi-2 codes which split them). Concrete-pump/vibrator alat
# in §..10.2 carry no coefficient in the source table, so omitted.
kategori: beton
referensi: "AHSP Bidang Cipta Karya, Permen PUPR No. 1/2022 §2.2.1.10"
sumber: "AHSP Bidang Cipta Karya Lampiran IV (hal. 124-125) — Permen PUPR 1/2022"
