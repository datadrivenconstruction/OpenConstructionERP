# AHSP koefisien — Kusen, Pintu, Jendela, Kaca
# Source: AHSP Bidang Cipta Karya (Lampiran IV), Permen PUPR No. 1/2022.
# Verified 2026-07-09 line-by-line vs the official PDF (pypdf) — all coefficients
# matched the source table EXACTLY:
#   §3.11.3.1 hal.298 (kusen aluminium, per m'), §3.11.1.11 hal.294 (daun pintu panel),
#   §3.11.1.9 hal.293 (daun pintu/jendela kaca), §3.12.3 hal.313 (kaca polos 5 mm)
# Pintu/jendela analyses are PEMBUATAN (fabrication) of the leaf; the kusen (frame)
# is priced separately per m' of frame length.
kategori: kusen
referensi: "AHSP Bidang Cipta Karya, Permen PUPR No. 1/2022 §3.11, §3.12"
sumber: "AHSP Bidang Cipta Karya Lampiran IV (hal. 293-298, 313) — Permen PUPR 1/2022"
items:
