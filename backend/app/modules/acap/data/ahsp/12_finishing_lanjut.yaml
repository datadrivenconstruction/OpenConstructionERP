    tenaga:
      - {jabatan: pekerja, koef_oh: 0.2000}
      - {jabatan: tukang_kayu, koef_oh: 0.1000}
      - {jabatan: kepala_tukang, koef_oh: 0.0100}
      - {jabatan: mandor, koef_oh: 0.0033}
