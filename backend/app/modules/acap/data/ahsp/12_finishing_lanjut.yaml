# AHSP koefisien — Finishing lanjut (rangka plafon, keramik dinding, genteng,
# waterproofing, cat kayu/besi)
# Source: AHSP Bidang Cipta Karya (Lampiran IV), Permen PUPR No. 1/2022.
# Verified 2026-07-09 line-by-line vs the official PDF (pypdf) — all coefficients
# matched the source table EXACTLY:
#   §3.5.3.1 hal.211 (rangka plafon besi hollow 40.40 — complements the gypsum
#                     penutup ACAP.PLAFON.GYPSUM_9 which is penutup-only)
#   §3.10.1.3 hal.278 (dinding keramik 10x20), §3.1.1.4 hal.177 (atap genteng beton),
#   §3.4.1 hal.203 (waterproofing membran bakar), §3.8.4 hal.234 (cat kayu/besi baru)
# NOTE: cat plafon/tembok reuses ACAP.CAT.TEMBOK_BARU (§3.8.10); §3.8.4 here is the
# wood/steel paint system (menie primer + plamur), for kusen/pintu/railing.
kategori: finishing
referensi: "AHSP Bidang Cipta Karya, Permen PUPR No. 1/2022 §3.5.3, §3.10.1, §3.1.1, §3.4.1, §3.8.4"
sumber: "AHSP Bidang Cipta Karya Lampiran IV (hal. 177, 203, 211, 234, 278) — Permen PUPR 1/2022"
items:
  - kode: ACAP.PLAFON.RANGKA_HOLLOW
    uraian: "Pemasangan 1 m2 rangka plafon besi hollow 40.40"
    satuan: m2
    bahan:
      - {nama: "Besi hollow 40x40", satuan: m1, koef: 4.00}
      - {nama: "Kawat las", satuan: kg, koef: 0.05}
    tenaga:
      - {jabatan: pekerja, koef_oh: 0.3500}
      - {jabatan: tukang_besi, koef_oh: 0.3500}
      - {jabatan: kepala_tukang, koef_oh: 0.0350}
      - {jabatan: mandor, koef_oh: 0.0117}
    alat: []
