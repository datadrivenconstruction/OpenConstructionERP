name: SBOM and License Inventory

# This used to run on `release: [published]` alone. That event is produced by
# release.yml through softprops/action-gh-release authenticated with
# secrets.GITHUB_TOKEN, and GitHub does not start a workflow from an event a
# GITHUB_TOKEN produced. v8.0.0 was published by hand, so the event arrived and
# this workflow ran; every release since was published by github-actions[bot]
# and none of them carry a licence inventory. Release Signing died the same way
# on the same day. It is now called from there, after the installers are
# attached and before they are checksummed.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to inventory and attach to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to inventory and attach to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # One observation, 2.6 minutes on v14.5.0, so this is a backstop rather than
    # a measured ceiling. It installs the backend with its dev extra and runs
    # npm ci, either of which can get slower without anything being wrong, so it
    # is set an order of magnitude above what was seen rather than close to it.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # An inventory of the default branch is not an inventory of the
          # release. Dependencies move between a tag and main.
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install tooling
        run: |
          pip install --upgrade pip
          pip install pip-licenses cyclonedx-bom
          npm install -g license-checker @cyclonedx/cyclonedx-npm

      - name: Backend - license inventory and SBOM
        id: backend
        run: |
          if [ -f backend/requirements.txt ] || [ -f backend/pyproject.toml ]; then
            cd backend
            if [ -f pyproject.toml ]; then
              pip install -e ".[dev]" || pip install -e .
            else
              pip install -r requirements.txt
            fi
            pip-licenses --format=markdown --output-file=../THIRD_PARTY_LICENSES_BACKEND.md
            pip-licenses --format=json --output-file=../sbom-backend-licenses.json
            # No `|| true` here. A swallowed failure produced an empty SBOM slot
            # that the attach step below was configured not to mind, so a broken
            # generator and a healthy one looked the same from the release page.
            cyclonedx-py environment -o ../sbom-backend.cdx.json
            cd ..
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Frontend - license inventory and SBOM
        id: frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm ci
            npx license-checker --production --markdown > ../THIRD_PARTY_LICENSES_FRONTEND.md
            cyclonedx-npm --output-file ../sbom-frontend.cdx.json
            cd ..
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          fi

      # Both generators stamp the moment they ran into the document they emit,
      # so generating the same SBOM from the same tag twice produces two files
      # that differ. That matters because this workflow runs twice per release
      # by design - see the header of release-signing.yml - and the second run
      # clobbers the first run's asset on a release whose SHA256SUMS was
      # computed over the first. On v17.0.2 that left the release serving a
      # manifest that misdescribed both SBOMs until the second manifest landed
      # a minute later.
      #
      # Two fields vary and only two. `components` and `dependencies` came back
      # byte-identical across both v17.0.2 runs, 141 and 141 for the backend and
      # 899 and 1022 for the frontend, and the whole difference was
      # `metadata.timestamp` and `serialNumber`. The second one is worth naming
      # because it hides: it is a fresh UUID per generation, and two UUIDs are
      # the same length, so a file whose only visible difference is a timestamp
      # can still be 174222 bytes in both runs and hash differently for a
      # reason a byte count cannot show.
      #
      # Neither field is dropped. A component list with no date and no identity
      # is worse to consume than one whose date and identity are derived from
      # the release rather than from the clock. The timestamp becomes the tag's
      # own commit date, which is still an honest answer to when this inventory
      # is from because the checkout above is at the tag, and the serial number
      # becomes a UUIDv5 over the release and the filename, which is stable for
      # the same release and distinct between releases.
      #
      # Done here rather than with a generator flag on purpose: neither
      # cyclonedx-bom nor @cyclonedx/cyclonedx-npm is pinned in the install step
      # above, so a flag that exists today is not a thing this file can rely on
      # next month. Rewriting the emitted JSON does not care which version
      # emitted it. Done inline rather than as a script in scripts/ because the
      # checkout is at `inputs.tag`, so a script added to main today does not
      # exist in the tree of a tag cut before today, which is every tag this
      # will first run against.
      - name: Pin the varying fields so a regenerated SBOM is byte-identical
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - "$TAG" "$REPO" sbom-backend.cdx.json sbom-frontend.cdx.json <<'PY'
          import json
          import subprocess
          import sys
          import uuid

          tag, repo = sys.argv[1], sys.argv[2]
          stamp = subprocess.run(
              ["git", "log", "-1", "--format=%cI"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.strip()

          for path in sys.argv[3:]:
              with open(path, "rb") as handle:
                  doc = json.loads(handle.read().decode("utf-8"))
              # json.loads preserves key order and json.dumps writes it back in
              # that order, so the re-serialisation is itself deterministic.
              doc["serialNumber"] = "urn:uuid:{}".format(
                  uuid.uuid5(uuid.NAMESPACE_URL, f"https://github.com/{repo}/releases/{tag}#{path}")
              )
              doc.setdefault("metadata", {})["timestamp"] = stamp
              with open(path, "w", encoding="utf-8", newline="\n") as handle:
                  json.dump(doc, handle, indent=2, ensure_ascii=False)
                  handle.write("\n")
              print(f"{path}: timestamp {stamp}, serial {doc['serialNumber']}")
          PY

      # Whether the pinning above actually made the file reproducible is a
      # measurement, not a claim, and the release is where it can be taken: on
      # the second run of a release the first run's SBOM is already published
      # with a hash recorded against it. Equal hashes mean the regeneration was
      # a no-op. Unequal means the dependency resolution genuinely moved
      # between the two runs, which is legitimate - `pip install` resolves from
      # PyPI at the moment it runs - and is not a reason to stop a release,
      # because the signing job downstream recomputes the manifest over
      # whatever is published. So this reports rather than refuses, and says
      # which of the two it saw.
      - name: Say whether this regeneration changed anything
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail
          if ! gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
                 --jq '.assets[] | "\(.name)\t\(.digest)"' > published.tsv 2>/dev/null; then
            echo "Could not read the release's assets, so nothing to compare against yet."
            exit 0
          fi
          for f in sbom-backend.cdx.json sbom-frontend.cdx.json; do
            here=$(sha256sum "$f" | cut -d' ' -f1)
            there=$(awk -F'\t' -v n="$f" '$1 == n { sub(/^sha256:/, "", $2); print $2; exit }' published.tsv)
            if [ -z "$there" ]; then
              echo "${f}: not on the release yet, this run is the first to attach it."
            elif [ "$here" = "$there" ]; then
              echo "${f}: identical to the copy already published (${here}). Regeneration was a no-op."
            else
              echo "::warning title=${f} changed between runs::The dependency resolution moved: published ${there}, generated ${here}. The manifest will be rebuilt over the new bytes."
            fi
          done

      - name: Aggregate THIRD_PARTY_LICENSES.md
        run: |
          {
            echo "# Third-Party Licenses"
            echo
            echo "Auto-generated by \`.github/workflows/sbom-and-licenses.yml\`"
            echo "for ${{ inputs.tag }}. For the authoritative NOTICE, see \`./NOTICE\`."
            echo
          } > THIRD_PARTY_LICENSES.md
          if [ "${{ steps.backend.outputs.backend }}" = "true" ] && [ -f THIRD_PARTY_LICENSES_BACKEND.md ]; then
            {
              echo "## Backend (Python)"
              echo
              cat THIRD_PARTY_LICENSES_BACKEND.md
              echo
            } >> THIRD_PARTY_LICENSES.md
          fi
          if [ "${{ steps.frontend.outputs.frontend }}" = "true" ] && [ -f THIRD_PARTY_LICENSES_FRONTEND.md ]; then
            {
              echo "## Frontend (JavaScript/TypeScript)"
              echo
              cat THIRD_PARTY_LICENSES_FRONTEND.md
              echo
            } >> THIRD_PARTY_LICENSES.md
          fi

          # Fonts ship as files inside the wheel and the installer, so neither
          # scanner above can see them: both enumerate installed packages and a
          # committed binary is not one. This section comes from the same
          # script that gates the invariant in Repo hygiene, so the published
          # inventory and the guard cannot disagree about what we ship; a
          # second generator walking the tree its own way would be a second
          # source of truth. It emits the licence text rather than a licence
          # label, because a label drops things like a Reserved Font Name that
          # a future font may declare.
          #
          # Unconditional on purpose. It reads the checkout, which is always
          # there, so unlike the two sections above it cannot go quietly
          # missing because a build step was skipped.
          python scripts/check_bundled_font_licences.py --markdown >> THIRD_PARTY_LICENSES.md

      # The written offer of source in NOTICE is what LGPL section 4 rests on
      # for the libraries whose source we do not ship. It is a real offer to a
      # real address, but an offer alone puts the whole burden on a recipient
      # writing to us. Where the source is small enough to travel with the
      # release it should, and this step attaches what it can.
      #
      # What it can and cannot do is worth stating, because the shape is not
      # obvious. psycopg2-binary publishes an sdist and that sdist is the source
      # of the LGPL work itself, so that one is a real discharge. OpenCV is not:
      # the LGPL library inside the wheel is FFmpeg, and an opencv-python sdist
      # is the source of the Python wrapper rather than of FFmpeg, so attaching
      # it documents the build without discharging anything. Nor does opencv
      # publish an sdist for every release; the version pinned for the desktop
      # build is one of the ones without. So the manifest records what was
      # attached AND what was not, and names what still rests on the offer. An
      # asset that quietly omitted the second half would read as a discharge it
      # is not.
      - name: LGPL corresponding source
        run: |
          set -euo pipefail
          mkdir -p lgpl-source

          # Two views of every version, because they differ. The environment
          # this job installed is what a wheel or container user resolves; the
          # desktop lock is what the installers actually carry.
          env_version() { pip show "$1" 2>/dev/null | awk '/^Version:/{print $2}'; }
          lock_version() {
            grep -iE "^$1==" backend/requirements-desktop.lock 2>/dev/null \
              | head -1 | sed 's/.*==//' | tr -d '[:space:]'
          }

          {
            echo "# LGPL Corresponding Source for ${TAG}"
            echo
            echo "The offer of source in NOTICE stands for every LGPL component in"
            echo "every artefact of this release. This file records which sources are"
            echo "attached here and which are not, so nobody has to guess."
            echo
            echo "## Attached"
            echo
          } > LGPL-SOURCES.md

          attached=0
          seen=""
          for pkg in psycopg2-binary opencv-python-headless; do
            for ver in "$(env_version "$pkg")" "$(lock_version "$pkg")"; do
              [ -n "$ver" ] || continue
              # the same version can come from both views, fetch it once
              case " $seen " in *" ${pkg}==${ver} "*) continue ;; esac
              seen="$seen ${pkg}==${ver}"

              # Two shapes of failure to survive rather than abort on. A version
              # that is not on PyPI at all answers 404, and a version with no
              # sdist answers with an empty selection; both belong in the manifest
              # rather than stopping a release. No head either: under pipefail a
              # reader that closes early can fail a pipeline that produced the
              # right answer.
              meta=$(curl -sSfL "https://pypi.org/pypi/${pkg}/${ver}/json" || true)
              url=""
              if [ -n "$meta" ]; then
                url=$(printf '%s' "$meta" \
                      | jq -r 'first(.urls[] | select(.packagetype=="sdist") | .url) // empty')
              fi
              if [ -n "$url" ]; then
                (cd lgpl-source && curl -sSfLO "$url")
                echo "- ${pkg} ${ver}: source attached as $(basename "$url")" >> LGPL-SOURCES.md
                attached=$((attached + 1))
              else
                {
                  echo "- ${pkg} ${ver}: upstream publishes no source distribution for this"
                  echo "  version. Write to info@datadrivenconstruction.io under the offer in"
                  echo "  NOTICE, naming this release."
                } >> LGPL-SOURCES.md
              fi
            done
          done

          {
            echo
            echo "## Still on the offer rather than attached"
            echo
            echo "FFmpeg, the LGPL-2.1 library inside every opencv-python wheel. An"
            echo "opencv-python source distribution is the source of the Python wrapper"
            echo "and not of FFmpeg, so it is not the corresponding source for that"
            echo "library and is not offered here as though it were. The FFmpeg"
            echo "libraries this release carries, from the installed package's own"
            echo "file list:"
            echo
          } >> LGPL-SOURCES.md
          # From the installed RECORD rather than from a build string, so these
          # are the files that actually ship. An empty result is possible (a
          # Windows environment bundles one ffmpeg DLL instead of these shared
          # objects), and a heading followed by nothing reads like a generator
          # that failed, so say which it is.
          ffmpeg_libs=$(pip show -f opencv-python-headless 2>/dev/null \
            | grep -oE 'lib(av|sw)[a-z]+[^ ]*\.(so|dylib)[0-9.]*' | sort -u || true)
          if [ -n "$ffmpeg_libs" ]; then
            printf '%s\n' "$ffmpeg_libs" | sed 's/^/- /' >> LGPL-SOURCES.md
          else
            {
              echo "- not enumerable from the environment this inventory was built in."
              echo "  They are inside the cv2 package directory of the wheel named above."
            } >> LGPL-SOURCES.md
          fi

          {
            echo
            echo "The GTK 3 and WebKitGTK stack inside the Linux AppImage. Those sources"
            echo "run to gigabytes, and they are published by the GNOME and WebKit"
            echo "projects and in the source packages of the distribution the image is"
            echo "built on. The offer covers them."
          } >> LGPL-SOURCES.md

          # Attaching nothing would leave a manifest promising sources next to
          # no sources. psycopg2-binary has published an sdist for every release
          # since 2.7, so zero attachments means something changed upstream, and
          # that should stop the release rather than pass quietly.
          if [ "$attached" -eq 0 ]; then
            echo "No LGPL source was attached at all, refusing to publish a manifest that lists none." >&2
            exit 1
          fi
          echo "attached $attached source archive(s)"
          ls -la lgpl-source
          cat LGPL-SOURCES.md
        env:
          TAG: ${{ inputs.tag }}

      - name: Confirm there is an inventory to publish
        run: |
          # The aggregate step always writes a header, so the file existing
          # proves nothing. An inventory with neither section is an empty
          # promise, and it is exactly what a silently failed generator leaves.
          for f in THIRD_PARTY_LICENSES.md LGPL-SOURCES.md sbom-backend.cdx.json sbom-frontend.cdx.json; do
            if [ ! -s "$f" ]; then
              echo "$f is missing or empty, refusing to publish an inventory that lists nothing." >&2
              exit 1
            fi
          done
          if ! grep -q '^## ' THIRD_PARTY_LICENSES.md; then
            echo "THIRD_PARTY_LICENSES.md has a header and no sections." >&2
            exit 1
          fi
          # A CycloneDX document with no components is well formed, non-empty
          # and worthless. Count the components rather than the bytes.
          for f in sbom-backend.cdx.json sbom-frontend.cdx.json; do
            n=$(jq '.components | length' "$f")
            echo "$f lists $n components"
            if [ "$n" -lt 1 ]; then
              echo "$f has no components." >&2
              exit 1
            fi
          done
          wc -l THIRD_PARTY_LICENSES.md

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: licenses-and-sbom
          path: |
            THIRD_PARTY_LICENSES.md
            LGPL-SOURCES.md
            lgpl-source/
            sbom-*.json
            sbom-*.cdx.json
          retention-days: 365

      # No event filter. This step used to carry `if: github.event_name ==
      # 'release'`, which is the one event that can no longer reach this
      # workflow, so the dispatch path built the whole inventory and threw it
      # away. The tag is passed in rather than inferred from the event, because
      # outside a release event there is no event to infer it from.
      #
      # Uploading with gh rather than action-gh-release: that action creates the
      # release when the tag has none, and here the release always exists
      # already. Creating a second one from a workflow that is only meant to
      # attach files is not a failure mode worth keeping.
      - name: Attach artefacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null

          # --clobber deletes the asset before uploading the replacement, so it
          # changes the asset id and there is a moment when the name resolves to
          # nothing. That is what killed the dispatched run on v15.6.0, which is
          # the incident the header of release-signing.yml is written around.
          # Replacing a file with the same bytes it already has buys none of
          # that risk and nothing else either, so with the fields pinned above
          # the second run of a release now leaves the release alone.
          #
          # Read once. One call answers for every file, and asking per file
          # would race with itself across the loop.
          gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
            --jq '.assets[] | "\(.name)\t\(.digest)"' > published.tsv 2>/dev/null || : > published.tsv

          upload() {
            f="$1"
            name=$(basename "$f")
            here=$(sha256sum "$f" | cut -d' ' -f1)
            there=$(awk -F'\t' -v n="$name" '$1 == n { sub(/^sha256:/, "", $2); print $2; exit }' published.tsv)
            # Only an equality decides to skip. A digest GitHub did not report
            # is not evidence of anything, and the safe reading of "no answer"
            # is to publish.
            if [ -n "$there" ] && [ "$there" = "$here" ]; then
              echo "${name}: already on the release with these exact bytes, not clobbering it."
              return 0
            fi
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber
          }

          for f in THIRD_PARTY_LICENSES.md sbom-backend.cdx.json sbom-frontend.cdx.json; do
            upload "$f"
          done
          # The LGPL manifest, and whatever source it managed to fetch. Globbed
          # rather than named, because which archives exist depends on what
          # upstream published for the pinned versions.
          upload LGPL-SOURCES.md
          for f in lgpl-source/*; do
            [ -e "$f" ] || continue
            upload "$f"
          done
