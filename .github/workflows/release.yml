# OpenConstructionERP Release Pipeline
#
# Triggered on version tag push (e.g., v0.1.0).
# Builds Docker image, pushes to GHCR, creates GitHub Release.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Build & Push Docker Image ──────────────────────────────────────
  # Note: CI runs separately on push/PR. The release pipeline trusts
  # that the tagged commit was already vetted on main and goes straight
  # to building the image — releases shouldn't be blocked by flaky
  # snapshot tests or lint debt that's tracked elsewhere.
  docker:
    permissions:
      contents: read
      packages: write
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Repo hygiene - no internal-only files
        run: python3 scripts/check_repo_hygiene.py

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$(echo $VERSION | cut -d. -f1-2)" >> $GITHUB_OUTPUT

      # GHCR rejects any tag whose repository path contains uppercase letters
      # ("repository name must be lowercase"), but ${{ github.repository }}
      # preserves the original casing (datadrivenconstruction/OpenConstructionERP).
      # Lowercase it once here and feed the result to every image tag below.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile.unified
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.major_minor }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=OpenConstructionERP
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later

  # ── Create GitHub Release ──────────────────────────────────────────
  release:
    permissions:
      contents: write
    name: GitHub Release
    needs: [docker]
    # Publish the GitHub Release even if the Docker push fails — a flaky
    # registry push should never block shipping the source release.
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -uo pipefail
          # Extract the section for this version from CHANGELOG.md
          VERSION="${{ steps.version.outputs.version }}"
          CONTENT=$(awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)

          # This used to fall back to the string "Release $VERSION" and carry
          # on, which made a step named "Extract changelog for this version"
          # unable to fail when there was no changelog for this version to
          # extract. The result was invisible twice over: the release body read
          # like a deliberate one-liner, and generate_release_notes appends
          # GitHub's own commit list underneath it, so the page looked full.
          # A tag whose CHANGELOG section is missing, or whose heading does not
          # match the "## [X.Y.Z]" shape this awk expects, is a release that
          # skipped the bump procedure, and that is worth stopping for.
          #
          # The docker job has already pushed the image by this point, so the
          # cost of stopping here is a published image with no release page
          # behind it. That is recoverable by adding the section and re-pushing
          # the tag, and it is the louder of the two failures.
          if [ -z "$CONTENT" ]; then
            echo "::error title=CHANGELOG.md has no section for $VERSION::Nothing under a '## [$VERSION]' heading in CHANGELOG.md, so this release would be published with no notes describing it. Add the section, then move the tag. Check the heading shape too: this reads '## [$VERSION]' exactly, so '## $VERSION' or '## [v$VERSION]' extracts nothing."
            exit 1
          fi
          # Write to file for multi-line support
          echo "$CONTENT" > /tmp/release-notes.md
          echo "Extracted $(printf '%s\n' "$CONTENT" | grep -c . || true) non-empty lines of notes for $VERSION."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OpenConstructionERP ${{ github.ref_name }}"
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
