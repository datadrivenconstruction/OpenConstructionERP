# Temporary: installer upgrade and fresh-install check before 18.5.0.
# Lives only on wip/installer-upgrade-185, never merged to main.
name: Installer upgrade check (temporary)

on:
  push:
    branches: [wip/installer-upgrade-185]
  workflow_dispatch:
    inputs:
      new_run_id:
        description: Desktop Release run whose windows-diagnostic artifact is the new installer
        required: false
        default: ""

permissions:
  contents: read
  actions: read

env:
  # The Desktop Release run (build_only_windows) that built the installer under test.
  NEW_RUN_ID: ${{ inputs.new_run_id || '37972495279' }}
  OLD_TAG: v18.4.0
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  upgrade:
    name: Upgrade 18.4.0 to new build
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/installer-check

      - name: Download both installers
        run: |
          . .github/installer-check/oe-check.ps1
          New-Item -ItemType Directory -Force old, new | Out-Null
          gh release download $env:OLD_TAG -p '*_x64-setup.exe' -D old
          $name = gh api "repos/$env:GH_REPO/actions/runs/$env:NEW_RUN_ID/artifacts" -q '.artifacts[] | select(.name | startswith("windows-diagnostic")) | .name'
          Say "new installer artifact: $name (run $env:NEW_RUN_ID)"
          gh run download $env:NEW_RUN_ID -n $name -D new
          Get-Content new\diagnostic-manifest.json | Write-Host
          Show-Installer (Get-ChildItem old\*.exe)[0].FullName
          Show-Installer (Get-ChildItem new\*.exe)[0].FullName

      - name: (a) Install 18.4.0, start, create project with a BOQ position, stop
        run: |
          . .github/installer-check/oe-check.ps1
          $app = 'C:\Program Files\OpenConstructionERP'
          $data = Join-Path $env:USERPROFILE '.openestimate'
          Install-Silent (Get-ChildItem old\*.exe)[0].FullName $null
          $l = Show-Layout $app
          $run = Start-App $app $data 900
          Say "old version reports $($run.Health.version)"
          $tok = Get-Token $run.Port $data
          $probe = New-ProbeData $run.Port $tok 'from-18.4.0'
          $probe | ConvertTo-Json | Set-Content (Join-Path $env:RUNNER_TEMP 'probe.json')
          Stop-App $run $app
          # A restart of 18.4.0 over its own populated database: is it "degraded" too?
          $again = Start-App $app $data 900
          Say "18.4.0 restart status=$($again.Health.status) arrived_populated_unstamped=$($again.Health.arrived_populated_unstamped)"
          Stop-App $again $app
          Save-Logs $data 'a-old'

      - name: (b) Install the new build over 18.4.0
        run: |
          . .github/installer-check/oe-check.ps1
          $app = 'C:\Program Files\OpenConstructionERP'
          Install-Silent (Get-ChildItem new\*.exe)[0].FullName $null
          $l = Show-Layout $app
          if (-not $l.Onedir) { Fail 'the upgraded install has no onedir server folder' }
          if ($l.Onefile) { Fail 'the old onefile server exe is still in the install dir' }

      - name: (c) Start the new build, health, version, data survived, no startup errors
        run: |
          . .github/installer-check/oe-check.ps1
          $app = 'C:\Program Files\OpenConstructionERP'
          $data = Join-Path $env:USERPROFILE '.openestimate'
          $run = Start-App $app $data 900
          Say "new version reports $($run.Health.version) build $($run.Health.build)"
          $tok = Get-Token $run.Port $data
          $probe = Get-Content (Join-Path $env:RUNNER_TEMP 'probe.json') -Raw | ConvertFrom-Json
          Test-ProbeData $run.Port $tok $probe
          $null = New-ProbeData $run.Port $tok 'after-upgrade'
          $errs = Get-StartupErrors $data $run.LogStart
          Say "startup log error lines since this start: $($errs.Count)"
          $errs | Select-Object -First 40 | ForEach-Object { Say "  ERR: $_" }
          Stop-App $run $app
          # Second start of the upgraded build: the old extraction sweep and a clean restart.
          $run2 = Start-App $app $data 900
          Test-ProbeData $run2.Port (Get-Token $run2.Port $data) $probe
          $errs2 = Get-StartupErrors $data $run2.LogStart
          Say "second start error lines: $($errs2.Count)"
          $errs2 | Select-Object -First 40 | ForEach-Object { Say "  ERR: $_" }
          Stop-App $run2 $app
          Save-Logs $data 'c-new'
          if ($errs.Count -or $errs2.Count) { Fail 'error lines in the startup log after the upgrade' }

      - name: (d) Uninstall and check leftovers
        if: ${{ !cancelled() }}
        run: |
          . .github/installer-check/oe-check.ps1
          $app = 'C:\Program Files\OpenConstructionERP'
          $u = Uninstall-App $app
          $data = Join-Path $env:USERPROFILE '.openestimate'
          Say "user data kept after uninstall (by design): $(Test-Path -LiteralPath $data)"
          if ($u.Exit -ne 0) { Fail "uninstaller exit $($u.Exit)" }
          if ($u.Procs) { Fail 'processes from the install dir survived the uninstall' }
          if ($u.Key) { Fail 'the uninstall registry key survived' }
          if (Test-Path -LiteralPath (Join-Path $app 'OpenConstructionERP.exe')) { Fail 'the main exe survived the uninstall' }

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs
          path: |
            ${{ runner.temp }}/oe-report.txt
            ${{ runner.temp }}/oe-logs
          if-no-files-found: warn

  cyrillic:
    name: Fresh install, ${{ matrix.case }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: Cyrillic install dir and home
            app: 'C:\Тест Установка\OpenConstructionERP'
            home: 'C:\Пользователи\Тестовый Сметчик'
          - case: default install dir, Cyrillic home
            app: 'C:\Program Files\OpenConstructionERP'
            home: 'C:\Users\Тестовый Сметчик'
          - case: default install dir, Chinese home
            app: 'C:\Program Files\OpenConstructionERP'
            home: 'C:\Users\测试用户'
          # Control: the same USERPROFILE override with a plain ASCII name.
          - case: default install dir, ASCII home override
            app: 'C:\Program Files\OpenConstructionERP'
            home: 'C:\Users\plainuser'
          # A real profile has AppData, and LOCALAPPDATA follows the home.
          - case: default install dir, Cyrillic home with AppData
            app: 'C:\Program Files\OpenConstructionERP'
            home: 'C:\Users\Сметчик Профиль'
            appdata: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/installer-check

      - name: Download the new installer
        run: |
          . .github/installer-check/oe-check.ps1
          New-Item -ItemType Directory -Force new | Out-Null
          $name = gh api "repos/$env:GH_REPO/actions/runs/$env:NEW_RUN_ID/artifacts" -q '.artifacts[] | select(.name | startswith("windows-diagnostic")) | .name'
          gh run download $env:NEW_RUN_ID -n $name -D new
          Show-Installer (Get-ChildItem new\*.exe)[0].FullName

      - name: Install, start with a non-ASCII home, health, data, stop, uninstall
        run: |
          . .github/installer-check/oe-check.ps1
          $app = '${{ matrix.app }}'
          $home_ = '${{ matrix.home }}'
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          $env:USERPROFILE = $home_; $env:HOME = $home_
          if ('${{ matrix.appdata }}' -eq 'true') {
            $env:LOCALAPPDATA = Join-Path $home_ 'AppData\Local'; $env:APPDATA = Join-Path $home_ 'AppData\Roaming'
            New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:APPDATA | Out-Null
          }
          Say "profile: USERPROFILE=$env:USERPROFILE LOCALAPPDATA=$env:LOCALAPPDATA home AppData\Local exists=$(Test-Path -LiteralPath (Join-Path $home_ 'AppData\Local'))"
          $data = Join-Path $home_ '.openestimate'
          $dir = if ($app -like 'C:\Program Files\*') { $null } else { $app }
          if ($dir -and ($dir -match '[^\x00-\x7F]')) {
            # A non-ASCII install folder must be refused cleanly, not installed.
            $p = Start-Process -FilePath (Get-ChildItem new\*.exe)[0].FullName -ArgumentList "/S /D=$dir" -PassThru -Wait
            Wait-Uninstallers
            $elog = Join-Path $env:TEMP 'OpenConstructionERP-install-error.log'
            Say "non-ASCII folder: installer exit=$($p.ExitCode) main exe present=$(Test-Path -LiteralPath (Join-Path $app 'OpenConstructionERP.exe')) error log=$(Test-Path -LiteralPath $elog) key=$([bool](Get-UninstallKey))"
            if (Test-Path -LiteralPath $elog) { Say ("error log: " + (Get-Content -LiteralPath $elog -Raw)) }
            if ($p.ExitCode -eq 0) { Fail 'the installer accepted a non-ASCII install folder' }
            if (Test-Path -LiteralPath (Join-Path $app 'OpenConstructionERP.exe')) { Fail 'files were installed into the refused folder' }
            if (Get-UninstallKey) { Fail 'a refused install left an uninstall key' }
            Say 'refused as intended'
            return
          }
          Install-Silent (Get-ChildItem new\*.exe)[0].FullName $dir
          $l = Show-Layout $app
          if (-not $l.Onedir) { Fail 'no onedir server folder in the Cyrillic install' }
          $run = Start-App $app $data 900
          $tok = Get-Token $run.Port $data
          $probe = New-ProbeData $run.Port $tok 'кириллица'
          Test-ProbeData $run.Port $tok $probe
          $errs = Get-StartupErrors $data $run.LogStart
          Say "startup log error lines: $($errs.Count)"
          $errs | Select-Object -First 40 | ForEach-Object { Say "  ERR: $_" }
          Stop-App $run $app
          foreach ($root in @($app, $home_, 'C:\Users\runneradmin\AppData\Local')) {
            Get-ChildItem -LiteralPath $root -Recurse -Directory -Filter EBWebView -ErrorAction SilentlyContinue | ForEach-Object { Say "webview data: $($_.FullName)" }
          }
          Save-Logs $data 'cyrillic'
          $u = Uninstall-App $app
          if ($u.Exit -ne 0) { Fail "uninstaller exit $($u.Exit)" }
          if ($u.Procs) { Fail 'processes from the install dir survived the uninstall' }
          if ($errs.Count) { Fail 'error lines in the startup log' }

      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fresh-logs-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/oe-report.txt
            ${{ runner.temp }}/oe-logs
          if-no-files-found: warn
