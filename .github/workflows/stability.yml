name: Stability (load, fresh install, long session)

# On-demand stability lane. It answers four questions the per-push lanes do not:
#
#   load-3gb        does the shipped Docker image hold N concurrent estimators
#                   inside the 3 GB floor from CLAUDE.md, and how fast does it
#                   come up cold?
#   compose-fresh   does the quickstart compose file come up on a clean box?
#   pip-clean-venv  does a wheel installed into a fresh venv serve on all three
#                   desktop OSes?
#   e2e-stability   does a real browser session survive token expiry, a backend
#                   restart and import/export over a long soak?
#   cold-start-probe how long until /api/health and the first login answer, and
#                   how much memory the process tree holds after boot?
#                   (only_cold_start=true runs this job alone; dispatch it on
#                   two refs and compare the artifacts for a before/after)
#
# It is manual only. Nothing here runs on push, so nothing here can starve or be
# cancelled by a later push the way the CI lane on main is.

on:
  workflow_dispatch:
    inputs:
      k6_scenarios:
        description: "k6 scenarios: shared (every VU edits one seeded position), isolated (each VU edits its own BOQ)"
        default: "shared,isolated"
        required: false
      vus:
        description: "Comma-separated k6 VU counts, one run each"
        default: "20,50"
        required: false
      duration:
        description: "k6 steady-state duration per VU count"
        default: "5m"
        required: false
      soak_minutes:
        description: "Session soak length for e2e-stability (minutes)"
        default: "70"
        required: false
      run_e2e:
        description: "Run the long browser session job"
        type: boolean
        default: true
      cold_start_max_seconds:
        description: "Fail load-3gb when cold start to healthy exceeds this"
        default: "60"
        required: false
      only_cold_start:
        description: "Run only cold-start-probe (skip load, compose, pip and e2e)"
        type: boolean
        default: false
      cold_start_runs:
        description: "Boots for cold-start-probe: one fresh install, then warm restarts"
        default: "4"
        required: false

permissions:
  contents: read

concurrency:
  group: stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load-3gb:
    name: Load under a 3 GB memory cap
    if: ${{ !inputs.only_cold_start }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      IMAGE: oe-stability:ci
      NET: oe-stab
      PG_PASSWORD: stability-ci-only
      APP_PORT: "8080"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the unified image
        run: docker build -t "$IMAGE" -f deploy/docker/Dockerfile.unified .

      - name: Start PostgreSQL
        run: |
          docker network create "$NET"
          docker run -d --name oe-pg --network "$NET" \
            -e POSTGRES_USER=oe -e POSTGRES_PASSWORD="$PG_PASSWORD" -e POSTGRES_DB=openestimate \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec oe-pg pg_isready -U oe -d openestimate && exit 0
            sleep 2
          done
          echo "::error::PostgreSQL did not become ready"
          exit 1

      - name: Start the app with --memory=3g and measure cold start
        id: cold
        run: |
          start=$(date +%s.%N)
          # The rate limits are raised on purpose: every VU signs in as the same
          # demo admin from one IP, and the default 200 req/min per user would
          # turn the run into a test of the limiter instead of the server.
          docker run -d --name oe-app --network "$NET" \
            --memory=3g --memory-swap=3g \
            -p "${APP_PORT}:8080" \
            -e OE_DB_HOST=oe-pg -e OE_DB_PORT=5432 -e OE_DB_USER=oe -e OE_DB_NAME=openestimate \
            -e OE_DB_PASSWORD="$PG_PASSWORD" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e APP_ENV=development -e APP_DEBUG=false -e SEED_DEMO=true \
            -e VECTOR_BACKEND=lancedb \
            -e API_RATE_LIMIT=100000 -e LOGIN_RATE_LIMIT=10000 \
            "$IMAGE"
          for i in $(seq 1 600); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${APP_PORT}/api/health" || true)
            if [ "$code" = "200" ]; then
              secs=$(echo "$(date +%s.%N) - $start" | bc)
              printf 'cold start to healthy: %.1fs (limit %ss)\n' "$secs" "${{ inputs.cold_start_max_seconds }}"
              echo "seconds=$secs" >> "$GITHUB_OUTPUT"
              echo "### Cold start: ${secs}s (limit ${{ inputs.cold_start_max_seconds }}s)" >> "$GITHUB_STEP_SUMMARY"
              # Over the limit is enforced at the end of the job, so the load
              # run still produces numbers on a slow start.
              echo "over=$(echo "$secs > ${{ inputs.cold_start_max_seconds }}" | bc)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::app never became healthy"
          docker logs --tail 150 oe-app
          exit 1

      - name: Start memory sampler
        if: ${{ !cancelled() && steps.cold.outcome != 'skipped' }}
        run: |
          # docker stats every 2s into a CSV; the PID file is what the stop
          # step kills, never a process name.
          # CPU goes to its own file so the memory parser stays as it is. One
          # uvicorn process held near 100% (one core) means the event loop is
          # the ceiling, not the database pool.
          nohup bash -c 'while true; do
              docker stats --no-stream --format "{{.MemUsage}}" oe-app 2>/dev/null \
                | awk -v t="$(date +%s)" "{print t\",\"\$1}"
              sleep 2
            done' > "$RUNNER_TEMP/mem.csv" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/sampler.pid"
          nohup bash -c 'while true; do
              docker stats --no-stream --format "{{.CPUPerc}}" oe-app 2>/dev/null \
                | awk -v t="$(date +%s)" "{print t\",\"\$1}"
              sleep 2
            done' > "$RUNNER_TEMP/cpu.csv" 2>/dev/null &
          echo $! > "$RUNNER_TEMP/cpu-sampler.pid"

      - name: Wait for the demo seed to finish
        run: |
          # /api/health can answer before the showcase projects are written.
          for i in $(seq 1 120); do
            tok=$(curl -s -X POST "http://127.0.0.1:${APP_PORT}/api/v1/users/auth/demo-login/" \
              -H 'Content-Type: application/json' -d '{"email":"demo@openconstructionerp.com"}' \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
            if [ -n "$tok" ]; then
              n=$(curl -s -H "Authorization: Bearer $tok" "http://127.0.0.1:${APP_PORT}/api/v1/projects/?limit=100" \
                | python3 -c 'import sys,json; print(len(json.load(sys.stdin)))' 2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then echo "demo user signed in, $n projects seeded"; exit 0; fi
            fi
            sleep 5
          done
          echo "::error::demo login or seeded projects never appeared"
          docker logs --tail 150 oe-app
          exit 1

      - uses: grafana/setup-k6-action@v1

      - name: Run k6 for each VU count
        id: k6
        run: |
          mkdir -p "$RUNNER_TEMP/k6"
          rc=0
          IFS=',' read -ra counts <<< "${{ inputs.vus }}"
          IFS=',' read -ra scenarios <<< "${{ inputs.k6_scenarios }}"
          for sc in "${scenarios[@]}"; do
            sc="$(echo "$sc" | tr -d ' ')"
            for v in "${counts[@]}"; do
              v="$(echo "$v" | tr -d ' ')"
              echo "::group::k6 SCENARIO=$sc VUS=$v"
              echo "k6 $sc vus=$v start $(date +%s)" >> "$RUNNER_TEMP/k6/k6-phases.txt"
              SCENARIO="$sc" VUS="$v" DURATION="${{ inputs.duration }}" BASE_URL="http://127.0.0.1:${APP_PORT}" \
                SUMMARY_OUT="$RUNNER_TEMP/k6/summary-$sc-vus-$v.json" \
                k6 run scripts/stability/k6-load.js || rc=1
              echo "k6 $sc vus=$v end $(date +%s)" >> "$RUNNER_TEMP/k6/k6-phases.txt"
              echo "::endgroup::"
            done
          done
          exit $rc

      - name: Peak memory, OOM and restarts
        if: ${{ always() && steps.cold.outcome != 'skipped' }}
        run: |
          [ -f "$RUNNER_TEMP/sampler.pid" ] && kill "$(cat "$RUNNER_TEMP/sampler.pid")" 2>/dev/null || true
          [ -f "$RUNNER_TEMP/cpu-sampler.pid" ] && kill "$(cat "$RUNNER_TEMP/cpu-sampler.pid")" 2>/dev/null || true
          peak=$(python3 - "$RUNNER_TEMP/mem.csv" <<'PY'
          import re, sys
          units = {"b": 1, "kib": 1024, "mib": 1024**2, "gib": 1024**3, "kb": 1e3, "mb": 1e6, "gb": 1e9}
          peak = 0.0
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              m = re.match(r"\d+,([\d.]+)([A-Za-z]+)", line.strip())
              if m:
                  peak = max(peak, float(m.group(1)) * units.get(m.group(2).lower(), 1))
          print(f"{peak / 1024**2:.0f}")
          PY
          )
          oom=$(docker inspect -f '{{.State.OOMKilled}}' oe-app)
          restarts=$(docker inspect -f '{{.RestartCount}}' oe-app)
          running=$(docker inspect -f '{{.State.Running}}' oe-app)
          echo "peak memory ${peak} MiB, OOMKilled=$oom, restarts=$restarts, running=$running"
          {
            echo "### Memory under 3 GB cap"
            echo "peak ${peak} MiB, OOMKilled=$oom, restarts=$restarts, running=$running"
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/mem.csv" "$RUNNER_TEMP/k6/" 2>/dev/null || true
          cp "$RUNNER_TEMP/cpu.csv" "$RUNNER_TEMP/k6/" 2>/dev/null || true
          # CPU per k6 phase, so a saturated run can be told from an idle one.
          python3 - "$RUNNER_TEMP/cpu.csv" "$RUNNER_TEMP/k6/k6-phases.txt" "$(nproc)" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import sys
          samples = []
          try:
              for line in open(sys.argv[1]):
                  t, _, v = line.strip().partition(",")
                  try:
                      samples.append((int(t), float(v.rstrip("%"))))
                  except ValueError:
                      pass
          except OSError:
              pass
          phases = {}
          try:
              for line in open(sys.argv[2]):
                  _, name, vus, edge, t = line.split()
                  phases.setdefault(f"{name} {vus}", {})[edge] = int(t)
          except (OSError, ValueError):
              pass
          print(f"\nrunner cores: {sys.argv[3]}; container CPU % where 100 = one full core")
          for key, edges in phases.items():
              vals = sorted(v for t, v in samples if edges.get("start", 0) + 30 <= t <= edges.get("end", 0))
              if vals:
                  print(f"- {key}: median {vals[len(vals) // 2]:.0f}%, p90 {vals[int(len(vals) * 0.9)]:.0f}%, max {vals[-1]:.0f}%")
          PY
          if [ "$oom" != "false" ] || [ "$restarts" != "0" ] || [ "$running" != "true" ]; then
            echo "::error::app was OOM-killed, restarted or stopped under load"
            docker logs --tail 200 oe-app
            exit 1
          fi

      - name: Upload k6 summaries and memory samples
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: stability-k6
          path: ${{ runner.temp }}/k6/
          retention-days: 14
          if-no-files-found: warn

      - name: Enforce the cold start limit
        if: ${{ always() && steps.cold.outputs.over == '1' }}
        run: |
          echo "::error::cold start ${{ steps.cold.outputs.seconds }}s is above ${{ inputs.cold_start_max_seconds }}s"
          exit 1

      - name: App log on failure
        if: failure()
        run: docker logs --tail 300 oe-app || true

  compose-fresh:
    name: Quickstart compose on a clean runner
    if: ${{ !inputs.only_cold_start }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Write the two required secrets
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env

      - name: docker compose up
        run: docker compose -f docker-compose.quickstart.yml up -d --build

      - name: Wait healthy, then health and demo login
        run: |
          for i in $(seq 1 120); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ~$((i * 5))s"; break; fi
            sleep 5
          done
          [ "$code" = "200" ] || { echo "::error::compose app never became healthy"; exit 1; }
          curl -fsS http://127.0.0.1:8080/api/health
          echo
          for i in $(seq 1 60); do
            status=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST \
              http://127.0.0.1:8080/api/v1/users/auth/demo-login/ \
              -H 'Content-Type: application/json' -d '{"email":"demo@openconstructionerp.com"}' || true)
            if [ "$status" = "200" ] && grep -q access_token /tmp/login.json; then
              echo "demo login OK"; exit 0
            fi
            sleep 5
          done
          echo "::error::demo login never succeeded (last status $status)"
          exit 1

      - name: Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.quickstart.yml logs --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.quickstart.yml down -v

  pip-clean-venv:
    name: Wheel in a clean venv (${{ matrix.os }})
    if: ${{ !inputs.only_cold_start }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same as the pack-wheel job in ci-postgres.yml: hatchling force-includes
      # frontend/dist, so an empty one lets the wheel build without npm.
      - name: Create empty frontend dist (hatchling force-include)
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: Build the wheel and install it into a fresh venv
        run: |
          python -m pip install --upgrade build
          (cd backend && python -m build --wheel --outdir "$RUNNER_TEMP/dist/")
          python -m venv "$RUNNER_TEMP/venv"
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$RUNNER_TEMP/venv/Scripts/python.exe"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.whl

      - name: Serve from outside the checkout and check health
        run: |
          # Start from RUNNER_TEMP so `app` can only come from the installed
          # wheel, never from backend/ in the checkout.
          cd "$RUNNER_TEMP"
          nohup "$PY" -m app.cli serve --port 8000 --data-dir "$RUNNER_TEMP/oe-data" > "$RUNNER_TEMP/serve.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/serve.pid"
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/health || true)
            if [ "$code" = "200" ]; then echo "wheel install healthy after ~$((i * 5))s"; exit 0; fi
            sleep 5
          done
          echo "::error::wheel install never became healthy"
          tail -120 "$RUNNER_TEMP/serve.log" || true
          exit 1

      - name: Stop the server
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/serve.pid" ] && kill "$(cat "$RUNNER_TEMP/serve.pid")" 2>/dev/null || true

  e2e-stability:
    name: Long browser session (soak, token expiry, restart)
    if: ${{ inputs.run_e2e && !inputs.only_cold_start }}
    runs-on: ubuntu-latest
    # Soak plus install, build, seed and the import/export specs. The cap only
    # decides when a hung job is killed, so it is generous on purpose.
    timeout-minutes: 240
    env:
      OE_PID_FILE: ${{ github.workspace }}/backend.pid
      OE_DATA_DIR: ${{ github.workspace }}/.oe-stability/data
      OE_LOG_FILE: ${{ github.workspace }}/.oe-stability/backend.log
      OE_BACKEND_DIR: ${{ github.workspace }}/backend
      OE_PORT: "8000"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      # The heap ceiling lives in the build script in frontend/package.json;
      # nothing set here can change it.
      - name: Build frontend (single-server SPA)
        working-directory: frontend
        run: npm run build

      - name: Install backend
        working-directory: backend
        run: pip install -e .

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start backend (embedded PostgreSQL, demo seed, 2 minute access token)
        working-directory: backend
        env:
          SEED_DEMO: "true"
          APP_ENV: development
          JWT_EXPIRE_MINUTES: "2"
        run: |
          # JWT_EXPIRE_MINUTES is exported for the whole job below as well, so
          # a restart through restart-backend.sh keeps the short token.
          echo "JWT_EXPIRE_MINUTES=2" >> "$GITHUB_ENV"
          echo "SEED_DEMO=true" >> "$GITHUB_ENV"
          echo "APP_ENV=development" >> "$GITHUB_ENV"
          export JWT_EXPIRE_MINUTES=2 SEED_DEMO=true APP_ENV=development
          mkdir -p "$(dirname "$OE_LOG_FILE")" "$OE_DATA_DIR"
          nohup python -m app.cli serve --port "$OE_PORT" --data-dir "$OE_DATA_DIR" > "$OE_LOG_FILE" 2>&1 &
          echo $! > "$OE_PID_FILE"
          echo "backend launched (pid $(cat "$OE_PID_FILE"))"

      - name: Wait for backend health
        run: |
          for i in $(seq 1 72); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${OE_PORT}/api/health" || true)
            if [ "$code" = "200" ]; then echo "backend healthy after $((i*5))s"; exit 0; fi
            sleep 5
          done
          echo "::error::backend never became healthy"
          tail -80 "$OE_LOG_FILE" || true
          exit 1

      - name: Run stability specs
        working-directory: frontend
        env:
          OE_TEST_BASE_URL: http://127.0.0.1:8000
          OE_TEST_API_URL: http://127.0.0.1:8000
          SESSION_SOAK_MINUTES: ${{ inputs.soak_minutes }}
          BACKEND_RESTART_CMD: bash ${{ github.workspace }}/scripts/stability/restart-backend.sh
        run: npx playwright test --config=playwright.stability.config.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-e2e
          path: |
            frontend/playwright-report/**
            frontend/test-results/**
            ${{ github.workspace }}/.oe-stability/backend.log
          retention-days: 14
          if-no-files-found: warn

      - name: Stop backend
        if: always()
        run: |
          [ -f "$OE_PID_FILE" ] && kill "$(cat "$OE_PID_FILE")" 2>/dev/null || true

  cold-start-probe:
    name: Cold start, first login and memory after boot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # The API is all the probe touches, so no frontend build.
      - name: Install backend
        working-directory: backend
        run: pip install -e . psutil httpx

      # Bare `app.cli serve` on embedded PostgreSQL, no Docker, so psutil sees
      # the real process tree. Boot 1 is a fresh install, the rest are warm
      # restarts of the same data directory.
      - name: Probe
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          python scripts/stability/cold_start_probe.py \
            --backend backend \
            --data-dir "$RUNNER_TEMP/oe-probe-data" \
            --runs "${{ inputs.cold_start_runs }}" \
            --out "$RUNNER_TEMP/probe/cold-start.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "ref \`${{ github.ref_name }}\` at \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-probe
          path: ${{ runner.temp }}/probe/**
          retention-days: 30
          if-no-files-found: warn
