# OpenConstructionERP — PyPI publish
#
# Triggered on version tag push (e.g., v5.0.0). Builds the frontend
# bundle, vendors it into the wheel layout, builds the wheel, and
# publishes to PyPI via Trusted Publishing (OIDC).
#
# No secrets required — the OIDC token is short-lived and minted at
# job-start time. To enable on the PyPI side (one-time, 2 minutes):
#   1. Sign in at https://pypi.org/manage/account/publishing/
#   2. "Add a new pending publisher" with:
#        PyPI Project Name: openconstructionerp
#        Owner: DataDrivenConstruction
#        Repository name: OpenConstructionERP
#        Workflow name: pypi-publish.yml
#        Environment name: pypi
#   3. Save. Next tag push to this repo publishes automatically.
#
# Manual fallback (no Trusted Publisher set up): see
#   the internal publish guide
# for the local twine upload procedure.

name: PyPI Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g., v5.0.0). Required for workflow_dispatch.'
        required: true
        type: string

permissions:
  contents: read
  # id-token: write is the OIDC permission Trusted Publishing requires.
  id-token: write

jobs:
  publish:
    name: Build + Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/openconstructionerp
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repo hygiene - no internal-only files in the tree
        run: python scripts/check_repo_hygiene.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Cesium 1.137+ requires Node 22; tsc-on-prebuild needs the full
          # devDeps set, so the frontend job is locked to 22.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend bundle into wheel layout
        # The heap ceiling for this build is NOT set here. frontend/package.json
        # runs both tsc and vite through node --max-old-space-size=9216 on the
        # command line, and an explicit flag beats NODE_OPTIONS in both
        # directions: measured, an environment asking for 9999 alongside a flag
        # of 1024 gives a 1216 MB heap. The value below therefore reaches only
        # npm's own process during npm ci, never the build, and editing it
        # cannot fix or cause an out of memory in Vite or tsc. Change
        # package.json for that.
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          cd frontend
          npm ci
          npm run build
          # NOTE: do NOT copy dist into backend/app/_frontend_dist here.
          # backend/pyproject.toml already declares
          #   [tool.hatch.build.targets.wheel.force-include]
          #   "../frontend/dist" = "app/_frontend_dist"
          # so hatchling vendors the bundle into the wheel itself. A manual
          # pre-copy makes the same files visible to both the packages=["app"]
          # walker AND the force-include map, producing duplicate ZIP entries
          # that PyPI rejects with 400 "Duplicate filename in local headers".

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel
        run: |
          cd backend
          python -m build --wheel --outdir ../dist/

      - name: Check wheel fits under the PyPI file-size limit
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, sys

          # PyPI rejects any single file over 100 MiB, and it rejects it at
          # upload, which here is after the tag is already public. Nothing
          # asserted the size before, so the first release to cross the line
          # would have found out the expensive way. This step runs immediately
          # after the build and before anything is published.
          #
          # The number: the hard cap is 100 MiB = 104857600 bytes. A wheel built
          # from a clean tree at 16.8.1 is about 85.8 MiB, and the trend across
          # 16.1.0 to 16.8.0 was 85.4 MB to 88.2 MB in eight days, roughly
          # 0.35 MB a day, driven by the bundled frontend and the regional packs.
          # 95 MiB sits about 9 MiB above today's wheel and 5 MiB below the cap:
          # at the observed rate that is roughly a month of warning, which is
          # enough time to shrink something deliberately rather than in a panic
          # on a tag that cannot be taken back.
          #
          # If this fails, do not just raise the number. Look at what grew first:
          # `python -c "import zipfile,collections;..."` over the wheel usually
          # shows one directory that doubled. Raising the limit past 100 MiB
          # cannot work at all, so the headroom is the whole point of it.
          LIMIT_MIB = 95
          HARD_CAP_MIB = 100

          whl = sorted(glob.glob("dist/*.whl"))
          assert len(whl) == 1, f"expected exactly one wheel in dist/, found {whl}"
          size = os.path.getsize(whl[0])
          mib = size / 1048576
          print(f"wheel {whl[0]} is {size:,} bytes ({mib:.1f} MiB)")
          if mib > LIMIT_MIB:
              sys.exit(
                  f"ERROR: wheel is {mib:.1f} MiB, over the {LIMIT_MIB} MiB budget. "
                  f"PyPI's hard limit is {HARD_CAP_MIB} MiB per file and it is enforced "
                  f"at upload, after this tag is public. Find what grew and drop it; "
                  f"raising the budget only moves the wall closer."
              )
          print(f"OK: {LIMIT_MIB - mib:.1f} MiB of headroom under the {LIMIT_MIB} MiB budget")
          PY

      - name: Sanity check wheel
        shell: bash
        run: |
          ls -lh dist/
          python - <<'PY'
          import os, re, zipfile

          # This check used to ask whether any member's name contained the
          # string "_frontend_dist". It could not fail. The build hook creates
          # frontend/dist/.placeholder whenever that file is missing, precisely
          # so the force-include map always resolves, so a wheel whose entire
          # user interface is one 123-byte placeholder satisfied it and printed
          # "wheel OK". The substring also matched _frontend_dist_prev, so a
          # wheel carrying nothing but a stale bundle passed too.
          #
          # Ask instead for the thing the check exists to prove: that the page
          # the server serves is in the wheel, and that everything that page
          # asks for is in the wheel with it.
          whl = next(f for f in os.listdir('dist') if f.endswith('.whl'))
          path = os.path.join('dist', whl)
          with zipfile.ZipFile(path) as z:
              files = set(z.namelist())
              index = 'app/_frontend_dist/index.html'
              assert index in files, f'wheel {whl} has no {index}; the built frontend did not reach it'
              html = z.read(index).decode('utf-8')

          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          local = [r for r in refs if not r.startswith(('http://', 'https://', 'data:', '//', '#'))]
          assert local, f'{index} asks for nothing; it is not a built page'
          missing = [r for r in local if 'app/_frontend_dist/' + r.lstrip('/').split('?')[0] not in files]
          assert not missing, f'wheel {whl} is missing {len(missing)} asset(s) index.html asks for: {missing[:5]}'

          # The migration tree and the translations are the other two payloads a
          # pip install cannot work without, and neither had a check at all.
          revisions = [f for f in files if f.startswith('alembic/versions/') and f.endswith('.py')]
          assert 'alembic.ini' in files, f'wheel {whl} has no alembic.ini, so alembic cannot run after install'
          assert len(revisions) > 100, f'wheel {whl} carries only {len(revisions)} migration revisions'
          locales = [f for f in files if f.startswith('locales/') and f.endswith('.json')]
          assert len(locales) >= 20, f'wheel {whl} carries only {len(locales)} locale files'

          # The community packs, which for the whole life of the project reached
          # no user at all: the tree was never packaged, and discovery resolved
          # its location by counting parent directories, which lands inside the
          # virtualenv's Lib after an install. Every pip and desktop user was
          # told there were no packs available. Config that reads correctly can
          # still build an archive without them, so ask the archive.
          # backend/tests/unit/test_community_packs_ship.py decides WHICH packs
          # belong here; this only insists that what was decided arrived.
          manifests = [f for f in files if f.startswith('packs/') and f.endswith('/manifest.py')]
          pack_slugs = sorted({f.split('/')[1] for f in files if f.startswith('packs/')})
          assert len(pack_slugs) >= 15, (
              f'wheel {whl} carries {len(pack_slugs)} community packs, and the tree ships at least '
              f'15. A wheel short of them installs to a UI that reports no packs available: '
              f'{pack_slugs}'
          )
          without_manifest = [s for s in pack_slugs if not any(m.startswith(f'packs/{s}/') for m in manifests)]
          assert not without_manifest, (
              f'wheel {whl} carries pack directories with no manifest.py, which discovery cannot '
              f'load and which therefore ship as dead bytes: {without_manifest}'
          )

          # The same question asked of the packs, because a manifest does not
          # only configure: it NAMES files. One JSON per additional_locales
          # entry, a logo, a favicon, an onboarding script, one reference
          # document per validation_rule_packs id. Nothing anywhere resolved one
          # of those names against a file, and four of them pointed at nothing.
          #
          # That is the captions.json defect below, forty lines from the check
          # that catches it. Worth saying plainly rather than just fixing: the
          # captions fix was written correctly and scoped to captions.json, and
          # nobody asked what else in the same archive names files it might not
          # carry. The answer was the packs, sitting twelve lines above it.
          #
          # backend/tests/unit/test_community_packs_ship.py asks this of the
          # tree on every run, which is where it can still stop a commit. This
          # asks it of the artefact, which is the only place that can say the
          # bytes actually arrived - force-include copies from the working tree,
          # and a build machine's tree is not a clean checkout.
          #
          # This reader skips a declaration it cannot evaluate statically rather
          # than failing on it. The tree-side gate refuses those outright, and
          # runs first, so an unreadable declaration is caught before a tag is
          # ever cut; duplicating that machinery into YAML would cost more than
          # it buys.
          import ast

          _SCALAR = ('logo_path', 'favicon_path', 'onboarding_script_path')
          _CALLS = ('PartnerPackManifest', 'PartnerBranding')
          declared = []
          with zipfile.ZipFile(path) as zp:
              for member in sorted(manifests):
                  pkg = member.rsplit('/', 1)[0]
                  for node in ast.walk(ast.parse(zp.read(member).decode('utf-8'), member)):
                      if not isinstance(node, ast.Call):
                          continue
                      called = getattr(node.func, 'id', None) or getattr(node.func, 'attr', '')
                      if called not in _CALLS:
                          continue
                      for kw in node.keywords:
                          value = kw.value
                          if kw.arg in _SCALAR:
                              if isinstance(value, ast.Constant) and isinstance(value.value, str):
                                  declared.append(f'{pkg}/{value.value}')
                          elif kw.arg == 'additional_locales' and isinstance(value, ast.Dict):
                              declared += [
                                  f'{pkg}/{p.value}' for p in value.values
                                  if isinstance(p, ast.Constant) and isinstance(p.value, str)
                              ]
                          elif kw.arg == 'validation_rule_packs' and isinstance(value, ast.List):
                              declared += [
                                  f'{pkg}/rule_packs/{e.value}.json' for e in value.elts
                                  if isinstance(e, ast.Constant) and isinstance(e.value, str)
                              ]

          # Guard the instrument before the comparison that leans on it. The
          # assertion below sweeps clean over an empty list, so a reader that
          # quietly stopped matching would report every pack perfect. The floor
          # sits far under the real count, which is well over a hundred, because
          # it is a check on this reader and not a target for the packs.
          assert len(declared) >= 50, (
              f'read only {len(declared)} declared asset path(s) from {len(manifests)} pack manifests '
              f'in wheel {whl}. They declare far more than that, so this reader has stopped seeing '
              f'them and the check below would pass over nothing.'
          )
          absent_assets = sorted(set(declared) - files)
          assert not absent_assets, (
              f'wheel {whl} carries pack manifests naming {len(absent_assets)} file(s) the wheel does '
              f'not contain: {absent_assets[:5]}. Nothing raises on a user machine and the UI falls '
              f'back, so this surfaces nowhere: the pack simply delivers less than it promised.'
          )

          # captions.json names twelve photographs and the package walk was
          # dropping every one of them: .gitignore globs *.jpg for dev
          # screenshots, and hatchling reads that file but does not honour the
          # negation exempting this directory, which git does honour. The wheel
          # shipped captions for pictures it did not carry, and a first run
          # logged sixty missing-asset lines and left the demo galleries empty.
          # Assert the manifest against the archive, so the next packaging
          # change that loses them fails here instead of on a user's first run.
          import json
          with zipfile.ZipFile(path) as z2:
              manifest = json.loads(
                  z2.read('app/scripts/flagship_assets/site_photos/captions.json')
              )
          wanted = ['app/scripts/flagship_assets/site_photos/' + e['file'] for e in manifest]
          absent = [w for w in wanted if w not in files]
          assert not absent, (
              f'wheel {whl} names {len(manifest)} demo photos in captions.json and is '
              f'missing {len(absent)} of them: {absent[:3]}'
          )

          print(
              f'wheel OK: {whl} - {len(files)} files, index.html plus all {len(local)} assets it asks for, '
              f'{len(revisions)} migrations, {len(locales)} locales, {len(pack_slugs)} packs carrying all '
              f'{len(declared)} files their manifests name'
          )
          PY

      - name: Repo hygiene - no internal-only files in the wheel
        run: python scripts/check_repo_hygiene.py --zip "$(ls dist/*.whl | head -n1)"

      - name: Detect publish mode
        id: pubmode
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "Publishing via API token (PYPI_API_TOKEN secret present)."
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "Publishing via Trusted Publishing (OIDC)."
          fi

      - name: Publish to PyPI (Trusted Publishing)
        if: steps.pubmode.outputs.has_token == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

      - name: Publish to PyPI (API token fallback)
        if: steps.pubmode.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
          attestations: false
