name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# We commit straight to main at a high rate, so nearly every run is a main push
# and, with nothing superseding them, twenty jobs per commit pile up behind each
# other. A run against a commit forty-nine behind the tip is worth less than a
# run against the tip, and paying for both gets neither in time. This trades
# per-commit signal for queue depth: a superseded run is cancelled, so a commit
# in the middle of a burst may never be tested on its own. If you need a verdict
# for one specific commit, re-run this workflow against it rather than reading
# across a neighbour's result.
#
# The group is a literal prefix, not ${{ github.workflow }}, and deliberately so.
# This file declares workflow_call, and in a called workflow that expression
# resolves out of the CALLER's context, so adding a caller later would silently
# rename the group. Nothing calls ci.yml today, but a tag is the one context in
# which such a call would plausibly appear, and tags trigger PyPI, Release and
# Desktop. A literal prefix cannot drift that way, and it matches the four
# concurrency blocks already in this directory.
#
# Tags are safe here twice over: the push filter above is branches-only, so a tag
# push never starts this workflow at all, and refs/tags/* would in any case form
# its own group, separate from refs/heads/main.
concurrency:
  group: ci-${{ github.ref }}
  # Not an unconditional true. This workflow fires on every push to main and
  # we push straight to main without PRs, so cancelling in progress means each
  # push kills the run from the push before it and main produces no verdict at
  # all. Measured 2026-08-29: 28 of the last 30 ci.yml runs on main were
  # cancelled, 19 of the last 20 consecutively. What that costs is not a wrong
  # answer, it is NO answer. A cancelled run has no conclusion, nothing goes
  # red, and the silence is indistinguishable from health.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify backend/frontend version literals match
        # Catches the drift that silently shipped v1.3.32 → v1.4.2 with
        # backend/pyproject.toml stuck at 1.3.31 (so /api/health lied
        # about the running version for 4 minor releases). The script
        # also flags CHANGELOG.md and the in-app Changelog.tsx if their
        # top entry doesn't match the source-of-truth backend version.
        run: python scripts/check_version_sync.py

  brand-check:
    name: Brand Token Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify no competitor or vendor brand token leaked in
        # Enforces the brand rule automatically so it never depends on a
        # reviewer remembering: no competitor or vendor product name in
        # code, UI strings, changelog, or docs. The script stores only
        # SHA-256 hashes of the brand tokens (the denylist itself is
        # brand-free) and permits a small reviewed set of functional
        # interop names via scripts/brand_token_allowlist.txt.
        run: python scripts/check_no_brand_tokens.py

      - name: Verify no proprietary classification content leaked in
        # A job stops at its first failing step, so without this condition the
        # check below was skipped exactly when the brand check above it was red,
        # which is the run where you most want to know. The brand check is
        # doubled into repo-hygiene.yml; this one is single-pointed here.
        if: ${{ !cancelled() }}
        # Division numbers are interoperability facts and stay; the
        # official division titles are the licensor's expression and
        # must never ship. The script pairs codes with hashed official
        # titles (never the literal strings) and also catches the
        # standard's display name used as a description of our own
        # content, with location-scoped allowances for pickers,
        # presets and validation rules that legitimately name it.
        run: python scripts/check_no_proprietary_classification.py

  backend:
    name: Backend CI (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # The unit tree has ~6300 tests and most of them touch the shared
    # PostgreSQL, so run serially it blew past even the doubled 120 minute
    # budget and was cancelled on every push (no green Backend CI since the
    # unit gate landed). pytest-split fans the collected tree across six matrix
    # shards, each on its own runner with its own throwaway PostgreSQL service,
    # so there is no cross-shard database contention and every shard finishes
    # well inside the cap. The integration tree still runs nightly in
    # ci-full.yml.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: backend

    # The app is PostgreSQL-only at runtime, so the test suite runs against a
    # real PostgreSQL 16 service. conftest honours an already-set DATABASE_URL
    # (this service) and only boots an embedded cluster when none is provided.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe
          POSTGRES_DB: openconstructionerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe -d openconstructionerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, because the byte-identity tests in
          # tests/unit/test_generated_documents_render_chinese.py rebuild the
          # pre-wiring PDF builders out of it and cannot compare anything
          # without it. blob:none makes that cheaper than the shallow clone it
          # replaces, 11 MB against 221 MB, because a depth 1 clone still pulls
          # every blob of the tip tree.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        # The backend wheel pulls in ../frontend/dist via force-include so a
        # production install bundles the SPA. CI runs the backend job in
        # parallel with the frontend job, so the dist directory may not exist
        # yet - create an empty placeholder so the editable install succeeds.
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep

      - name: Install dependencies
        # Identified so the steps below can ask whether the environment
        # actually came up. They run after a red step, so their own result
        # stays visible, but not after a failed install: pytest missing
        # from PATH reports a screenful of failures that all name the
        # wrong cause.
        id: install
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        # Same guard as every step below it. ruff arrives through the dev extra,
        # so a failed install does not make this step lint badly - it makes it
        # report that ruff is not on PATH, which is the wrong cause named
        # loudly. This was the one step above that was missing the guard the
        # install comment describes.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Check formatting with ruff
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Run unit tests with pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # Point the suite at the postgres:16 service. conftest sees DATABASE_URL
        # is already set and uses it instead of booting an embedded cluster.
        # Only this shard's slice of tests/unit runs here: pytest-split
        # partitions the collected tree deterministically across --splits so
        # every test runs in exactly one shard and the union is the whole unit
        # tree. The per-test --timeout matches the nightly so a single hung test
        # becomes a reported failure instead of a silent 90 minute stall. The
        # full integration tree runs nightly in ci-full.yml.
        env:
          DATABASE_URL: postgresql+asyncpg://oe:oe@localhost:5432/openconstructionerp_test
          DATABASE_SYNC_URL: postgresql+psycopg2://oe:oe@localhost:5432/openconstructionerp_test
          # We do not carry the GAEB schema in the repository, so the tests
          # that validate our exporter against it skip unless a copy is
          # available. This is the one place they should not skip: without
          # it the only thing checking our GAEB output is a schema we wrote
          # ourselves. The fetch is opt-in everywhere else, and a test that
          # cannot reach the publisher skips rather than fails, so a bad day
          # at gaeb.de cannot turn the lane red.
          OCE_GAEB_FETCH_XSD: "1"
        run: >-
          pytest tests/unit -q -ra --durations=25
          --timeout=300 --timeout-method=signal
          --splits 6 --group ${{ matrix.shard }}

  backend-gate:
    name: Backend CI
    # One stable status check that is green only when every backend shard
    # passed. Keeps a single "Backend CI" check for branch protection and
    # at-a-glance status while the work is fanned across the shard matrix above.
    needs: [backend]
    # Not always(). always() runs this job when the run was CANCELLED too, and
    # the step below reads needs.backend.result, which is then "cancelled"
    # rather than "success", so the gate exits 1 and the one check branch
    # protection watches goes red for a run nobody let finish. Measured rather
    # than reasoned: of the cancelled runs that reached this gate, 33047173405
    # had all six shards conclude cancelled with not one of them failed, and
    # "Backend CI" still reported failure. Skipping is the honest answer there,
    # because a cancelled run earned no verdict either way. Leaving always() and
    # teaching the script to pass on "cancelled" would be worse still: it would
    # report the backend green when nothing ran.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all backend shards to pass
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend shards did not all pass: ${{ needs.backend.result }}"
            exit 1
          fi
          echo "All backend shards passed."

  tenant-isolation:
    name: Tenant Isolation / IDOR
    # Cross-tenant + IDOR (Insecure Direct Object Reference) regressions are the
    # highest-severity bug class in a multi-tenant app: one missing
    # verify_project_access / tenant_id filter leaks another customer's data.
    # The bulk of the isolation suite lives under tests/integration and
    # tests/modules, which the sharded Backend CI above does NOT run (it runs
    # only tests/unit) - so until now those tests gated merges only nightly in
    # ci-full.yml. This dedicated job runs JUST the isolation + IDOR selection on
    # every PR against a throwaway PostgreSQL 16 service, so a cross-tenant leak
    # blocks the merge instead of surfacing the next morning. It is fast because
    # it collects only the security selection, not the whole integration tree.
    runs-on: ubuntu-latest
    # The isolation + IDOR selection legitimately runs a long time on the shared
    # runners, so an early 30 minute cap was cancelling otherwise green runs.
    # Last measured at 2015s (33m35s) for 515 tests, and the widened selection
    # below is 658 tests, which projects to roughly 43 minutes. That would sit
    # inside a 45 minute cap with about 5% to spare, which is not headroom, it
    # is a cancellation waiting for the next module to land. 60.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend

    # Same postgres:16 service the Backend CI shards use. conftest honours an
    # already-set DATABASE_URL (this service) and only boots an embedded cluster
    # when none is provided, so pointing DATABASE_URL here keeps the tests off
    # the slower embedded-PG path.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oe
          POSTGRES_PASSWORD: oe
          POSTGRES_DB: openconstructionerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oe -d openconstructionerp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        # Mirrors the Backend CI job: the editable install force-includes
        # ../frontend/dist, which may not exist yet in this parallel job.
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tenant-isolation + IDOR suite
        # Collect ONLY the cross-tenant / IDOR selection from the integration and
        # module trees (the unit-level *_idor.py / tenant-scope guards already
        # run in the sharded Backend CI). --timeout matches the nightly so a hung
        # test fails loud instead of stalling the cap.
        #
        # This selects a marker, not a spelling. `tenant_isolation` is registered
        # in backend/pyproject.toml together with the definition it is applied
        # by: identity is the variable under test, and both polarities belong,
        # because a lane holding only denials is satisfied by a gate that denies
        # everyone, exactly as a lane holding only grants is satisfied by a gate
        # that grants everyone.
        #
        # It replaces a 26 word -k chain, and the swap is not simply a widening.
        # -k matches the whole node id, module filename included, so 150 of the
        # 678 ids that chain selected were dragged in by the name of the file
        # they sit in rather than by anything they assert, and several of its
        # words were collecting their homonyms: `foreign` took foreign currency
        # and foreign keys, `leak` took a provider key never shown to its own
        # owner, `scoping` took indexed columns and report periods, `invisible`
        # took a soft-deleted row, and `tenant` took a lease agreement written
        # for a renter. Against the same two trees the marker selects a
        # different set in both directions. It drops what the chain caught by
        # accident, and it adds boundary tests the chain could not see at all
        # because neither their file name nor their test name carries any of its
        # words, among them
        # test_a_dashboard_cannot_be_pinned_to_someone_elses_project and
        # test_cache_purge_requires_admin.
        #
        # Nothing has to be edited here when a boundary test is written. It
        # joins this lane by carrying the marker, which is the property a
        # keyword chain could never have: the chain needed a new word for every
        # test that spelled itself differently.
        #
        # THE SECOND RUN IS A RATCHET, NOT AN ARCHITECTURE.
        #
        # These two trees are gated on push and pull request by this job and by
        # nothing else: the sharded Backend CI runs `pytest tests/unit` only, and
        # the nightly is not a merge gate. So every test the old chain selected
        # was gated, including the ones it selected by accident, and dropping any
        # of them here would stop them gating anywhere. Gated by accident is
        # still gated, and removing gating is a regression whatever the reason
        # the gating existed.
        #
        # The second run therefore selects exactly the remainder: what the frozen
        # chain took and the marker does not take. Swapping the selector loses
        # nothing. The net of the swap was +152 and -56, which reads as +96 and
        # hides the -56 entirely; the residue is what keeps the minus honest.
        #
        # It is a ratchet to be drained, not a lane to be maintained. Draining it
        # means each test it still holds either earns a marker of its own and
        # moves to the first run, or moves into the unit shards. A new boundary
        # test does not belong here; it earns `tenant_isolation` and joins the
        # first run. The chain is a record of what used to be gated, not a rule.
        #
        # THIS RUN'S SIZE GROWS ON ITS OWN, AND A GROWING NUMBER HERE IS NOT A
        # SIGNAL OF ANYTHING.
        #
        # `-k` matches names at run time, not at the time it was written, so this
        # run acquires any test whose node id happens to contain one of the words
        # below. It had already acquired two in the hours between being measured
        # and being committed. That is the mechanism working as designed and not
        # neglect, so the count moving upward needs no response.
        #
        # It is worth knowing how wide the match is, because pruning a word to
        # bring the number down would silently un-gate whatever that word was
        # holding. `-k` tests the whole node id as a substring, which is four
        # surfaces: the file path, the class, the test name, and the parametrize
        # id. Of the 678 the chain selected, only 346 matched on the test name
        # alone; 150 came in on their file path, 6 on a class name, and 2 on a
        # parametrize id. And the words are substrings rather than tokens, so
        # `idor` matches `corridor`: four building-geometry tests about corridor
        # door clearance were in this lane for that reason and no other.
        env:
          DATABASE_URL: postgresql+asyncpg://oe:oe@localhost:5432/openconstructionerp_test
          DATABASE_SYNC_URL: postgresql+psycopg2://oe:oe@localhost:5432/openconstructionerp_test
        run: |
          # Frozen 2026-08-23 as the record of what the pre-marker chain gated.
          # Drain it, do not extend it, and do not prune it to make the count
          # look tidy. See the comment above for why the count moves by itself.
          CHAIN="idor or isolation or tenant or authz or rls or cross_project or cross_package or cross_boq or other_project or other_user or foreign or stranger or non_member or non_owner or non_author or unrelated or uninvolved or scoping or sees_own or leak or invisible or impersonat or smuggle or tamper or user_b or wrong_project"

          # Both runs always execute, so one red lane never hides the other.
          #
          # Each call below stays on one line, selector included, on purpose.
          # Anything that reads this file line by line, tests/unit/test_ci_lane_
          # coverage.py included, sees a command and its selector together. Split
          # across a backslash continuation, the first line carries the tree
          # names and no selector, so the lane reads as unfiltered to every
          # reader that is not a shell.
          rc=0
          echo "::group::tenant_isolation marker"
          pytest tests/integration tests/modules -q -ra --timeout=300 --timeout-method=signal -m tenant_isolation || rc=1
          echo "::endgroup::"

          echo "::group::frozen residue (what the old chain gated and the marker does not)"
          pytest tests/integration tests/modules -q -ra --timeout=300 --timeout-method=signal -m "not tenant_isolation" -k "$CHAIN" || rc=1
          echo "::endgroup::"

          exit $rc

  zero-width-guard:
    name: Block zero-width Unicode characters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan frontend/src
        # Zero-width and bidi-isolate Unicode characters embedded in i18n
        # defaultValue strings crashed React reconciliation on /contracts when a
        # browser translation extension mutated the DOM (task #135 / R6). The fix
        # stripped 9000+ occurrences across 363 files; this guard blocks
        # reintroduction.
        #
        # Which characters count as stray, which four are letters and required
        # marks, and why scanning those four once cost us Persian, Bengali and
        # Hebrew spelling, are all documented in the script. Do not restate the
        # character class here: this job and frontend/package.json each used to
        # carry their own copy, the copies drifted, and the script's --self-check
        # now fails the build if either grows one again.
        #
        # The name says frontend/src alone on purpose. marketing-site cannot
        # be scanned from here at all: the file list comes from git ls-files
        # with --exclude-standard, that path is ignored in its entirety, and
        # CI never checks it out either. The root contributes zero files and
        # the job exits 0 whichever way it goes. A step name promising a path
        # the run always declines to scan is worse than no name at all,
        # because the name is what a reader trusts when deciding whether
        # something is covered.
        run: python3 scripts/check_zero_width.py

  frontend:
    name: Frontend CI (${{ matrix.os }})
    # The SPA is developed on Windows, built on Linux for the wheel, and bundled
    # into desktop installers for all three OSes, so lint, type-check, build and
    # the unit tests run on every OS. This catches the path-separator,
    # case-sensitivity and CRLF class of breakage before it reaches a
    # contributor or a desktop build, instead of only on the Linux runner.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        # tsc --noEmit whole-program check OOMs at the old 6 GB ceiling
        # ("Reached heap limit Allocation failed", exit 134). ubuntu and windows
        # are 16 GB runners and get the proven-local 9 GB ceiling for headroom as
        # the codebase grows. macOS is a 7 GB Apple-Silicon runner where even the
        # 6 GB ceiling already thrashes at the physical limit (GC "Ineffective
        # mark-compacts", ~16 min) and a 9 GB heap exceeds total RAM, so it skips
        # this step. tsc is OS-independent, so ubuntu (case-sensitive, strictest)
        # plus windows fully cover the type check; macOS still runs lint and the
        # unit tests for its OS-specific (path/CRLF/runtime) signal.
        if: matrix.os != 'macos-latest'
        env:
          NODE_OPTIONS: --max-old-space-size=9216
        run: npm run typecheck

      - name: Build
        # `tsc -b && vite build` runs another whole-program compile, so it needs
        # the same 9 GB heap and likewise cannot fit the 7 GB macOS runner.
        if: matrix.os != 'macos-latest'
        env:
          NODE_OPTIONS: --max-old-space-size=9216
        run: npm run build

      - name: Run tests
        # Two steps rather than one because of the Build step above. The
        # tests under frontend/tests/pwa read the build output, and they now
        # FAIL on a missing artifact instead of skipping themselves, so they
        # can only run on a runner that built. macOS deliberately does not,
        # so it names the exclusion here. Written as an exclusion in the
        # workflow rather than as a skip inside the test on purpose: a skip
        # reports green having read nothing, and a green that means "I did
        # not look" is the failure this pair of steps exists to remove.
        if: matrix.os != 'macos-latest'
        run: npm run test

      - name: Run tests (no build output on this runner)
        # Red before this change, run 33282669278: every test passed - 678
        # files, 7818 tests, zero failures - and the step still exited 1,
        # because one vitest fork died. The job log names the cause on line
        # 3661, "FATAL ERROR: Reached heap limit Allocation failed - JavaScript
        # heap out of memory", with the last GC at 2063 MB, and vitest surfaced
        # it as an unhandled "Worker exited unexpectedly" rather than as a test
        # result. A step that is red while nothing failed is the worst kind of
        # red: it was standing across three runs, and for two of them it was
        # carrying real failures at the same time.
        #
        # 2063 MB is not a limit anyone here chose. It is V8's default
        # old-space, which scales with machine memory: about 4 GB on the 16 GB
        # x64 runners and about 2 GB on this 7 GB arm64 one. So leaving
        # NODE_OPTIONS unset is not one setting shared by three runners, it is a
        # different ceiling on each, and that is the whole reason ubuntu and
        # windows run this identical command green. Both factors of the peak
        # were left to the machine: the fork count follows the core count and
        # the heap follows the RAM.
        #
        # Pin both, so the worst case is arithmetic instead of discovered: at
        # most 2 workers times 3072 MB is 6 GB, inside the 7 GB this runner has.
        # 3072 and not 4096 for that reason exactly - two forks at 4096 is 8 GB
        # and would put the ceiling back above the machine - and it still hands
        # the fork that died half again as much as the 2063 MB it died at.
        # Honest gap: the runner's core count is not printed in the job log, so
        # whether maxWorkers=2 lowers the fork count or merely fixes it where it
        # already sat is untested. What it does either way is bound the product.
        #
        # Do not answer a future failure here by deleting the step. macOS skips
        # Type check and Build deliberately, for reasons on those steps, but it
        # still runs lint and the unit tests to keep the OS-specific path, CRLF
        # and runtime signal. That signal is why this step exists at all.
        if: matrix.os == 'macos-latest'
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run test -- --exclude "tests/pwa/**" --maxWorkers=2

      - name: Verify every Playwright project still selects tests
        # A project whose grep matches no spec is the one kind of dead test
        # lane Playwright reports nothing about: it contributes no failures and
        # the summary reads as a pass. This lists the suite without launching
        # anything, so it needs no browsers and takes about a second.
        # OE_E2E_VERIFY_CONFIG_ONLY drops the companion check that each
        # project's browser is on disk, which is true of a machine rather than
        # of the config and would fail everything on a runner that installs no
        # browsers. That half belongs to whoever is about to run the tests, and
        # runs by default for them.
        #
        # Placed last on purpose, and it earned the position. It sat between
        # Lint and Type check, and at the time it was failing for a real reason:
        # every configured project selected zero tests. That is fixed - remeasured
        # 2026-08-30, this step exits 0 and the default config selects twelve
        # specs - and the sentence is in the past tense now because a present
        # tense claim in a comment that nobody rechecks goes on describing a
        # state that ended. The ordering argument below does not depend on it
        # being red today. Because a failing step
        # aborts the job, Type check, Build and the unit tests were all reported
        # as skipped on all three runners, which meant `npm run build` - the one
        # gate the frontend actually answers to - had not executed in CI at all
        # while this was red. A secondary check that masks the primary one costs
        # more than it catches. Nothing is weakened by moving it: the step still
        # runs on every push and still fails the job on the same defect. It just
        # no longer decides whether the compiler gets to speak. Order the steps
        # so that the most load-bearing gate reports first and the cheapest
        # advisory reports last, because a red that hides four other verdicts
        # tells you less than the four verdicts would have.
        # `!cancelled()` rather than `always()`: this has to report even when an
        # earlier step failed, which is the entire point of moving it, but it
        # should not keep running after somebody cancels the run or after a
        # superseding push. That is also the form the rest of this file already
        # uses, on twenty-one other steps.
        if: ${{ !cancelled() }}
        env:
          OE_E2E_VERIFY_CONFIG_ONLY: "1"
        run: npm run test:e2e:verify-projects

      - name: Verify every Playwright config selects committed specs
        # The step above is the same question asked of ONE config. `playwright
        # test --list` with no --config reads playwright.config.ts and nothing
        # else, so fifteen of the sixteen configs in this directory have never
        # been asked whether they select anything. It also asks the disk, and
        # the disk is not what CI checks out.
        #
        # This asks all sixteen, and asks the repository. The population comes
        # from `git ls-files`, so a spec that exists locally and is ignored by
        # git counts as absent - which is the state of every fresh clone and of
        # this runner. That is not hypothetical: playwright.assets-audit.config.ts
        # selects two specs that sit under .gitignore line 70, so it selects two
        # here and zero in CI, and a run of it is a green empty summary.
        #
        # It also asks each config the same question from three synthetic
        # checkout roots. That is the class of defect fixed in c497946ce, where
        # testIgnore '**/runner/**' meant tests/e2e/runner/ to the author and
        # every file in the checkout to a GitHub Linux or macOS runner, whose
        # working directory is under /home/runner or /Users/runner. It was green
        # on Windows, fatal elsewhere, and could not be found by reading the
        # config. A config that answers differently under two roots is red here.
        #
        # No browsers, no server, no run: it loads the configs with playwright's
        # own loader and filters with playwright's own createFileMatcher, so the
        # rule it applies is playwright's rather than an imitation, and it
        # checks that claim on every run by recomputing each project's selection
        # through playwright itself and requiring the two to agree.
        #
        # Runs on all three OSes deliberately. It normalises paths, and a path
        # bug in a path checker is worth catching on the OS that has the other
        # separator.
        if: ${{ !cancelled() }}
        run: node ../scripts/check_playwright_config_selection.mjs

      - name: Verify every committed spec is selected by some Playwright config
        # The step above asks whether every CONFIG selects a spec. This asks the
        # inverse, whether every SPEC is selected by a config. They are not the
        # same question and they do not have the same answer: the first is green
        # and the second finds five specs that no configuration runs. Reading the
        # first as an answer to the second is a mistake shaped like a
        # confirmation, which is why it is a second step and not a second
        # assertion inside the first.
        #
        # It asserts only what the repository already states about itself.
        # playwright.config.ts ignores 'tests/e2e/*.spec.ts' on the written
        # grounds that those specs "are invoked via their dedicated configs at
        # the repo root". The gate resolves that pattern against the commit and
        # requires the claim to hold for every file it really covers, so the
        # denominator grows on its own when a spec is added next to them. A hand
        # written exclusion list would have been a denominator somebody has to
        # remember, and we rejected one of those in a neighbouring task for that
        # reason. Every other unselected spec is printed as a census with names
        # and does not affect the exit code, because "no config names this file"
        # is not by itself a defect.
        #
        # Population comes from `git ls-tree` at an explicitly resolved commit,
        # printed next to the verdict. Not the disk, and not `ls-files`: a count
        # taken off a working copy is a correct number about a tree nobody else
        # has.
        if: ${{ !cancelled() }}
        run: node ../scripts/check_e2e_spec_coverage.mjs

      - name: Prove the case coverage ratchet can fail
        # A gate only ever seen passing is indistinguishable from one that
        # cannot fail. This builds playbooks and locales in memory, loses a
        # key, ships a case without strings, and fails if the check stays
        # quiet on any of it.
        if: ${{ !cancelled() }}
        run: node scripts/check-case-coverage.mjs --selftest

      - name: Check no case answers fewer translated keys than the manifest records
        # A case playbook names its strings by key and carries the English
        # inline, so a key no locale answers renders English in that locale
        # and nothing else reports it: the orphan gate reads literal t()
        # calls and here the key is a variable off a data row, and the drift
        # check (run by caseTranslationDrift.test.ts in the step above) skips
        # a key that was never translated because it cannot have gone stale.
        # This counts what every offered locale still does not answer, per
        # playbook, against a committed floor that --update can only lower.
        # Measured on 2026-09-06 over 220 playbooks, 7037 keys and 40 locales,
        # so it pins the debt where it stands rather than clearing it.
        #
        # Last in the job and under !cancelled() on purpose: a missing
        # translation must not skip the build and the tests, and a failed
        # build must not hide a missing translation. On all three OSes for
        # the reason the two steps above give: it reads the tree by path.
        if: ${{ !cancelled() }}
        run: node scripts/check-case-coverage.mjs

  backend-cross-os:
    name: Backend CI (${{ matrix.os }}, embedded PG, shard ${{ matrix.shard }}/3)
    # GitHub Actions service containers are Linux-only, so the Windows and macOS
    # runners cannot use the postgres:16 service the Linux shards rely on. They
    # boot the SAME embedded PostgreSQL the desktop app and self-hosted installs
    # ship with (pixeltable-pgserver, no Docker) - conftest starts it
    # automatically when DATABASE_URL is unset. That is exactly the path a
    # Windows or macOS user runs, so this gates the desktop and self-hosted build
    # on every push. e2e-cross-os.yml already proves the embedded cluster boots
    # on these runners.
    runs-on: ${{ matrix.os }}
    # Advisory during rollout: the unit tree has never run on Windows or macOS
    # before, so it reports on every push (that is the point - maximum quality
    # signal on every change) but does not block while first-time OS-specific
    # gaps are shaken out. Remove this line to make it a hard gate once it is
    # consistently green.
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history, because the byte-identity tests in
          # tests/unit/test_generated_documents_render_chinese.py rebuild the
          # pre-wiring PDF builders out of it and cannot compare anything
          # without it. blob:none makes that cheaper than the shallow clone it
          # replaces, 11 MB against 221 MB, because a depth 1 clone still pulls
          # every blob of the tip tree.
          fetch-depth: 0
          filter: blob:none

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create empty frontend dist (hatchling force-include)
        # mkdir -p / touch are POSIX; force the Git Bash shell so this step
        # behaves the same on the Windows runner (default there is PowerShell).
        shell: bash
        run: |
          mkdir -p ../frontend/dist
          touch ../frontend/dist/.gitkeep

      - name: Install dependencies
        # The embedded PostgreSQL server (pixeltable-pgserver) is a base
        # dependency, so [dev] alone is enough to boot it and run the suite -
        # the same install the Linux shards use.
        run: pip install -e ".[dev]"

      - name: Run unit tests with pytest (embedded PostgreSQL)
        # No DATABASE_URL is set on purpose: conftest boots the embedded
        # pixeltable-pgserver cluster, the same one the desktop app uses, instead
        # of a Docker service. The unit tree is fanned across 3 shards per OS so
        # each finishes inside the cap. --timeout-method=thread because the
        # signal method uses SIGALRM, which does not exist on Windows.
        run: >-
          pytest tests/unit -q -ra --durations=25
          --timeout=300 --timeout-method=thread
          --splits 3 --group ${{ matrix.shard }}
