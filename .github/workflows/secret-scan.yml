# Secret scanning.
#
# Until this file existed, nothing in this repository looked for a credential.
# gitleaks is declared in .pre-commit-config.yaml and, like every other hook in
# that file, ran nowhere: pre-commit is not installed in the working checkout,
# so the declaration was a gate on paper only. This is the running half. The
# hook is left exactly as it is; installing pre-commit is a separate decision.
#
# Why a workflow of its own rather than a step in Repo hygiene: that gate was
# regrouped into three jobs because it had grown wide enough to starve the
# runner pool, and its header records the incident. A scan that reads patches
# does not belong in a job whose latency budget is the reason it was rewritten.
#
# Why a pinned binary rather than the published action: the self-test below has
# to exercise the same tool, with the same arguments, as the scan it vouches
# for. Behind an action the two would be different things, and a green self-test
# would say nothing about the scan. The download is pinned to a version and
# checked against its published SHA-256 before it is allowed to run.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.30.1'
  # From the release's own checksums file. Bump both together or the install
  # step fails closed, which is the intended behaviour.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A scan over a shallow checkout reads one commit, finds nothing and
          # passes: a green tick from a guard that never ran. The range scan
          # below also needs the base of the range to be present locally.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # A scanner that has never caught anything cannot be told apart from a
      # scanner that cannot catch anything. This plants a credential-shaped
      # string outside the tree and fails the job unless gitleaks names it, so
      # every run re-proves the scan below is able to go red before anyone
      # believes it when it goes green. It runs the same binary, with the same
      # config, as the scan - which is the only reason it is evidence about it.
      #
      # The literal is assembled from two halves at run time. Written whole it
      # would be a finding in this very file. It is also a specific literal
      # that is known to fire: gitleaks quietly declines some well-formed
      # tokens, so a self-test built on an unverified one would pass by never
      # detecting anything, which is the failure this step exists to catch.
      - name: Prove the scanner can fail
        if: ${{ !cancelled() }}
        run: |
          # `set +e` is not redundant beside `set -uo pipefail`. GitHub runs a
          # `run:` block under `bash -e`, and `set -uo pipefail` does not turn
          # errexit off, so the shell dies on the first non-zero command. Every
          # step here deliberately runs one - a scanner that finds something
          # exits 1, and that is the outcome being measured - and then reads
          # `$?`. Without this line the step dies at exactly the line whose
          # failure is the point, and reports it as the step failing. It passed
          # in local testing because an interactive shell carries no `-e`.
          set +e
          set -uo pipefail
          probe="${RUNNER_TEMP}/planted"
          mkdir -p "$probe"
          printf 'token = "ghp_%s"\n' '0123456789abcdefghijklmnopqrstuvwx12' > "${probe}/planted.txt"
          ./gitleaks dir "$probe" --config .gitleaks.toml --no-banner --redact --verbose > probe.log 2>&1
          rc=$?
          cat probe.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::gitleaks passed a planted credential, so the scan below proves nothing"
            exit 1
          fi
          if ! grep -q 'github-pat' probe.log; then
            echo "::error::gitleaks failed but did not name the planted credential"
            exit 1
          fi
          echo "self-test ok: planted credential reported as github-pat, exit ${rc}"

      # Scans what this push or pull request adds, not the whole archive. A new
      # branch, or a push whose base is no longer reachable after a rewrite,
      # has no usable range and falls back to scanning the tree as it stands.
      #
      # --redact so a finding names the rule, the file and the line without
      # reprinting the credential into a public build log, which would leak it
      # a second time to a wider audience than the commit did.
      - name: Scan what this change adds
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # `set +e` is not redundant beside `set -uo pipefail`. GitHub runs a
          # `run:` block under `bash -e`, and `set -uo pipefail` does not turn
          # errexit off, so the shell dies on the first non-zero command. Every
          # step here deliberately runs one - a scanner that finds something
          # exits 1, and that is the outcome being measured - and then reads
          # `$?`. Without this line the step dies at exactly the line whose
          # failure is the point, and reports it as the step failing. It passed
          # in local testing because an interactive shell carries no `-e`.
          set +e
          set -uo pipefail
          base=""
          if [ -n "${PR_BASE:-}" ]; then
            base="$PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ] && git rev-parse -q --verify "${base}^{commit}" > /dev/null; then
            echo "scanning ${base}..${HEAD_SHA}"
            ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose \
              --log-opts="${base}..${HEAD_SHA}"
          else
            echo "no usable commit range for this event; scanning the working tree instead"
            ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose
          fi
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::gitleaks reported a finding. Reproduce locally with: gitleaks git . --config .gitleaks.toml --redact --verbose"
            exit "$rc"
          fi
          exit 0

      # A sweep of the whole archive, on request only. It is deliberately not
      # wired to push: it does not pass today, and what it reports was handed
      # to the maintainers directly rather than written down here. Whether that
      # becomes a blocking gate is a decision for them, not a default.
      - name: Sweep the whole history
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        run: |
          # `set +e` is not redundant beside `set -uo pipefail`. GitHub runs a
          # `run:` block under `bash -e`, and `set -uo pipefail` does not turn
          # errexit off, so the shell dies on the first non-zero command. Every
          # step here deliberately runs one - a scanner that finds something
          # exits 1, and that is the outcome being measured - and then reads
          # `$?`. Without this line the step dies at exactly the line whose
          # failure is the point, and reports it as the step failing. It passed
          # in local testing because an interactive shell carries no `-e`.
          set +e
          set -uo pipefail
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
