[package]
name = "openconstructionerp-desktop"
version = "16.7.0"
description = "OpenConstructionERP Desktop, construction cost estimation and BOQ platform"
authors = ["DataDrivenConstruction <info@datadrivenconstruction.io>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# On Linux and the BSDs this drags in the GTK3 stack, and with it glib 0.18.5,
# which carries RUSTSEC-2024-0429 (GHSA-wrw7-89jp-8q8g, moderate): unsound code
# in glib::VariantStrIter that dereferences a null pointer on optimised builds.
# There is no upgrade to take. The fix is in glib 0.20, gtk 0.18.2 asks for
# glib ^0.18, gtk3-rs ended at 0.18.2, and the glib 0.18 line ended at 0.18.5
# three months before the fix was merged, so no 0.18 release carries it. The
# advisory closes when Tauri leaves GTK3, not before.
# We never reach the flaw. Variant::array_iter_str is the only way to obtain a
# VariantStrIter, and no crate between this one and glib names it. That is a
# fact about today's dependency graph, so check it again when this line moves.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
portpicker = "0.1"
# Random secret for the backend's shutdown endpoint, one per run of the app.
# uuid is already in this build's dependency graph (Tauri pulls it in), so
# asking for it by name adds an edge and no download.
uuid = { version = "1", features = ["v4"] }

# Native Win32 MessageBox for the startup-failure fail-safe, and ShellExecuteW
# for opening links and files. windows-sys is already pulled in transitively
# (e.g. via dirs-sys/errno) at 0.59, so this adds no new major version to the
# dependency graph.
#
# Win32_UI_Shell is what carries ShellExecuteW, and Win32_System_Com is for the
# CoInitializeEx around it: the shell may delegate an open to a shell extension
# that requires an apartment, so the call is made on a thread that has one. Both
# are features of a crate that is already a direct dependency, and cargo records
# versions and edges rather than features, so neither changes Cargo.lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
