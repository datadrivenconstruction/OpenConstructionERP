services:
  postgres:
    image: pgduckdb/pgduckdb:16-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oe}
      POSTGRES_DB: ${POSTGRES_DB:-openestimate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oe} -d ${POSTGRES_DB:-openestimate}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.12.5}
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_API_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      OE_CELERY_BROKER_URL: redis://redis:6379/1
      OE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oe}:${POSTGRES_PASSWORD:-oe}@postgres:5432/${POSTGRES_DB:-openestimate}
      DATABASE_SYNC_URL: postgresql://${POSTGRES_USER:-oe}:${POSTGRES_PASSWORD:-oe}@postgres:5432/${POSTGRES_DB:-openestimate}

volumes:
  pg_data:
    name: ocerp_pg_data
  minio_data:
    name: ocerp_minio_data
  qdrant_data:
    name: ocerp_qdrant_data