[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-turkey-tr"
version = "0.2.0"
description = "Country pack for Türkiye: the poz numbering of the Ministry unit-price book for building, mechanical and electrical works, the 25 percent contractor profit and general expenses, KDV at 20 percent with two reduced rates, Turkish lira."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OpenConstructionERP", email = "info@datadrivenconstruction.io" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "country-pack",
    "turkey",
    "birimfiyat",
    "poz",
    "mekanik-tesisat",
    "elektrik-tesisati",
    "tbdy",
    "deprem",
    "tse",
    "kdv",
    "lira",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Turkish",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=5.5.0",
]

[project.urls]
Source = "https://github.com/DataDrivenConstruction/openconstructionerp"

[project.entry-points."openconstructionerp.partner_packs"]
turkey-tr = "openconstructionerp_turkey_tr:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_turkey_tr = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
