[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-croatia-hr"
version = "0.1.0"
description = "Country pack for the Croatian market: troškovnik estimating with all-in unit rates, EUR currency, PDV at 25% with the 13%, 5% and 0% rates, Zakon o gradnji and Zakon o javnoj nabavi references, DIN 276 as the nearest supported cost hierarchy."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OpenConstructionERP", email = "info@datadrivenconstruction.io" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "country-pack",
    "croatia",
    "hrvatska",
    "troskovnik",
    "pdv",
    "din276",
    "eur",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Croatian",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=5.5.0",
]

[project.urls]
Source = "https://github.com/DataDrivenConstruction/openconstructionerp"

[project.entry-points."openconstructionerp.partner_packs"]
croatia-hr = "openconstructionerp_croatia_hr:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_croatia_hr = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
