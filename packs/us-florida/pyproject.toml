[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-us-florida"
version = "0.1.0"
description = "Florida state pack for OpenConstructionERP: the contractor as ultimate consumer of materials, the county surtax cap per item, local wage preemption, the public retainage cap, the payment clocks and the notice to owner and claim of lien deadlines."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OpenConstructionERP", email = "info@datadrivenconstruction.io" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "partner-pack",
    "usa",
    "florida",
    "sales-tax",
    "construction-lien",
    "retention",
    "prompt-payment",
    "notice-to-owner",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Intended Audience :: Manufacturing",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=5.5.0",
]

[project.urls]
Source = "https://github.com/DataDrivenConstruction/openconstructionerp"

[project.entry-points."openconstructionerp.partner_packs"]
us-florida = "openconstructionerp_us_florida:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_us_florida = [
    "logo.svg",
    "onboarding.yaml",
    "rule_packs/*.json",
]
