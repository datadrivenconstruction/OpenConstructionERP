[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openconstructionerp-peru-pe"
version = "0.1.0"
description = "Country pack for Peru: the presupuesto de obra with gastos generales, utilidad and IGV at 18 percent, detracciones, monthly valorizaciones with the 10 percent retention, public works under the contracting law, SUNAT UBL 2.1 invoice export, Peruvian sol."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "OpenConstructionERP", email = "info@datadrivenconstruction.io" },
]
keywords = [
    "openconstructionerp",
    "ocerp",
    "country-pack",
    "peru",
    "presupuesto",
    "valorizacion",
    "igv",
    "detraccion",
    "sunat",
    "osce",
    "sol",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Spanish",
    "Natural Language :: English",
]
dependencies = [
    "openconstructionerp>=18.8.1",
]

[project.urls]
Source = "https://github.com/DataDrivenConstruction/openconstructionerp"

[project.entry-points."openconstructionerp.partner_packs"]
peru-pe = "openconstructionerp_peru_pe:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_peru_pe = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
