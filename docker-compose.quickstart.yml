# OpenConstructionERP - Quickstart Docker Compose
#
# ⚠️  EVALUATION / LOCAL-DEMO ONLY - NOT FOR PRODUCTION
#
# Both POSTGRES_PASSWORD and JWT_SECRET MUST be supplied via env vars
# (or a `.env` file beside this compose file). Compose fails fast with
# a readable error if they are missing - instead of silently shipping
# globally-shared defaults that anyone could use to forge JWTs (BUG-D03).
# Generate them once with:
#
#   echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)" >  .env
#   echo "JWT_SECRET=$(openssl rand -hex 32)"           >> .env
#
# Any real deployment SHOULD use docker-compose.prod.yml.
#
# All-in-one deployment: write the .env above, then run
#   docker compose -f docker-compose.quickstart.yml up --build
#
# This block used to say "Zero-config, just run", contradicting the note at the
# top of this same file fifteen lines earlier. It was true until the two secrets
# stopped having defaults, and it is the half of the file a reader in a hurry
# scrolls to, so it kept sending people to a command that stops on an
# unset-variable error they had just been told about.
#
# This starts:
#   - PostgreSQL 16 (data persisted in Docker volume, not exposed to host)
#   - Backend (FastAPI, serves API + frontend)
#   - Accessible at http://localhost:8080
#
# PostgreSQL is required (SQLite support was removed in v6.6.0). To run the
# unified image against your own PostgreSQL instead of the bundled one:
#   docker run -d -p 8080:8080 -v oe_data:/data \
#     -e DATABASE_URL=postgresql+asyncpg://user:pass@host:5432/dbname \
#     -e JWT_SECRET=$(openssl rand -hex 32) \
#     openconstructionerp
#   (Build first: docker build -t openconstructionerp -f deploy/docker/Dockerfile.unified .)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oe
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - generate with: openssl rand -base64 24}"
      POSTGRES_DB: openestimate
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oe -d openestimate"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not exposed to host - only accessible by backend

  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.unified
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Where the app is published on the host. The defaults are what a first
      # run wants: every interface, port 8080. Behind a TLS terminator you
      # generally want the opposite, so that the only way in is through the
      # proxy:
      #
      #   OE_BIND=127.0.0.1 docker compose -f docker-compose.quickstart.yml up -d
      #
      # then point the proxy for your host name at 127.0.0.1:8080. The app does
      # not terminate TLS itself and is not meant to; 443 belongs to the proxy.
      - "${OE_BIND:-0.0.0.0}:${OE_PORT:-8080}:8080"
    environment:
      # PostgreSQL connection - required, the image has no database default.
      # The parts are passed rather than a finished URL. Compose has no
      # urlencode, so interpolating the password straight into a URL breaks
      # for anyone whose password contains "@": the user info splits at the
      # first one and the host silently becomes something like "ss@postgres",
      # which resolves nowhere. The entrypoint composes and percent-encodes
      # these. Setting DATABASE_URL directly still overrides all of it.
      OE_DB_HOST: postgres
      OE_DB_PORT: "5432"
      OE_DB_USER: oe
      OE_DB_NAME: openestimate
      OE_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - generate with: openssl rand -base64 24}"
      # Security - required, no default. Compose fails fast if blank.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - generate with: openssl rand -hex 32}"
      # Frontend serving
      SERVE_FRONTEND: "true"
      # The addresses a browser is allowed to call the API from. Serving the
      # app on a host name means adding that host name here, because the
      # browser sends the public origin and not the one the container sees:
      #
      #   OE_ALLOWED_ORIGINS=https://erp.example.com
      #
      # Getting this wrong is quiet in a confusing way. The page loads and the
      # login form works, and then the first call after it is refused by the
      # browser rather than by us, so the failure shows up as an empty screen
      # with nothing in the server log.
      ALLOWED_ORIGINS: "${OE_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost}"
      # Persistent data dir - pins the unified resolver at the /data volume
      # below so BIM geometry survives container recreate (otherwise the
      # resolver defaults to ~/.openestimate in the ephemeral container layer).
      OE_DATA_DIR: /data
      # Defaults
      APP_ENV: development
      APP_DEBUG: "false"
      VECTOR_BACKEND: lancedb
    volumes:
      - app_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pg_data:
    driver: local
  app_data:
    driver: local
